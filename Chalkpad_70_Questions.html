", "solution": "import java.util.*;\nimport java.util.function.IntUnaryOperator;\n\npublic class Main {\n    static int applyOperation(int amount, IntUnaryOperator operation) {\n        return operation.applyAsInt(amount);\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n\n        int amount = sc.nextInt();\n        int value = sc.nextInt();\n        String type = sc.next();\n\n        IntUnaryOperator operation;\n        if (type.equals(\"ADD\"))\n            operation = x -> x + value;\n        else\n            operation = x -> x * value;\n\n        System.out.println(applyOperation(amount, operation));\n    }\n}", "sourceHasSql": false}, {"id": 47, "topic": "Functional Java", "description": "A student-information system stores the names of students. The system needs to print each\nstudent name in uppercase.\n\nWrite a Java program using a method reference to refer to the appropriate String method for\nconverting each name to uppercase.\n\nInput Format\n\nThe first line contains N.\n\nThe second line contains N student names separated by spaces.\n\nOutput Format\n\nPrint all student names in uppercase separated by spaces.\nCode Constraints\n\n1 ≤ N ≤ 100\nEach name contains only alphabetic characters.", "input": "3\namit neha rahul", "output": "AMIT NEHA RAHUL", "solution": "import java.util.*;\nimport java.util.stream.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        List<String> names = new ArrayList<>();\n        for (int i = 0; i < n; i++) names.add(sc.next());\n\n        String result = names.stream()\n                .map(String::toUpperCase)\n                .collect(Collectors.joining(\" \"));\n\n        System.out.println(result);\n    }\n}", "sourceHasSql": false}, {"id": 48, "topic": "Functional Java", "description": "A warehouse system evaluates product quantities using different rules. One rule determines\nwhether a product quantity is greater than 50, while another calculates the quantity after\nadding a safety stock of 10 units.\n\nWrite a Java program that uses functional interfaces and passes functions to separate\nmethods to perform these operations.\n\nInput Format\n\nThe first line contains N.\n\nThe second line contains N product quantities.\n\nOutput Format\n\nFirst print the number of products having quantity greater than 50.\n\nOn the second line, print the updated quantities after adding 10.\n\nCode Constraints\n\n1 ≤ N ≤ 100\n0 ≤ Quantity ≤ 1000", "input": "5\n20 60 45 80 100", "output": "3\n30 70 55 90 110", "solution": "import java.util.*;\nimport java.util.function.*;\n\npublic class Main {\n    static <T, R> List<R> mapValues(List<T> values, Function<T, R> fn) {\n        List<R> result = new ArrayList<>();\n        for (T value : values) result.add(fn.apply(value));\n        return result;\n    }\n\n    static int countMatching(List<Integer> values, Predicate<Integer> rule) {\n        int count = 0;\n        for (int value : values)\n            if (rule.test(value)) count++;\n        return count;\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        List<Integer> quantities = new ArrayList<>();\n\n        for (int i = 0; i < n; i++) quantities.add(sc.nextInt());\n\n        int count = countMatching(quantities, q -> q > 50);\n        List<Integer> updated = mapValues(quantities, q -> q + 10);\n\n        System.out.println(count);\n        for (int i = 0; i < updated.size(); i++) {\n            if (i > 0) System.out.print(\" \");\n            System.out.print(updated.get(i));\n        }\n        System.out.println();\n    }\n}", "sourceHasSql": false}, {"id": 49, "topic": "Multithreading", "description": "A railway ticketing system processes a number of ticket requests using a separate thread.\nThe system should start the ticket-processing thread, allow it to process all requests, and\nwait for the thread to complete before the main program continues.\n\nWrite a Java program that creates a thread to process the given number of ticket requests.\nThe thread should print the number of processed requests. The main thread must wait for\nthe ticket-processing thread to complete using join().\n\nInput Format\n\nThe first line contains the number of ticket requests.\n\nOutput Format\n\nThe thread should print the number of processed tickets. After the thread completes, print\nProcessing Completed.\n\nCode Constraints\n\n0 ≤ N ≤ 1000", "input": "5", "output": "Tickets Processed: 5\nProcessing Completed", "solution": "import java.util.*;\n\npublic class Main {\n    static class TicketProcessor extends Thread {\n        private final int requests;\n\n        TicketProcessor(int requests) {\n            this.requests = requests;\n        }\n\n        public void run() {\n            System.out.println(\"Tickets Processed: \" + requests);\n        }\n    }\n\n    public static void main(String[] args) throws InterruptedException {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        TicketProcessor thread = new TicketProcessor(n);\n        thread.start();\n        thread.join();\n\n        System.out.println(\"Processing Completed\");\n    }\n}", "sourceHasSql": false}, {"id": 50, "topic": "Multithreading", "description": "A food-delivery application processes customer orders in a separate thread. Each order has\nan order ID, and the application must create a thread by extending the Thread class.\n\nWrite a Java program that creates a class extending Thread. The thread should process the\ngiven order and print its order ID.\n\nInput Format\n\nThe first line contains the order ID.\n\nOutput Format\n\nPrint:\n\nOrder <ID> Processing\n\nCode Constraints\n1 ≤ Order ID ≤ 100000", "input": "105", "output": "Order 105 Processing", "solution": "import java.util.*;\n\nclass OrderThread extends Thread {\n    private final int orderId;\n\n    OrderThread(int orderId) {\n        this.orderId = orderId;\n    }\n\n    public void run() {\n        System.out.println(\"Order \" + orderId + \" Processing\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Scanner sc = new Scanner(System.in);\n        int orderId = sc.nextInt();\n\n        OrderThread thread = new OrderThread(orderId);\n        thread.start();\n        thread.join();\n    }\n}", "sourceHasSql": false}, {"id": 51, "topic": "Multithreading", "description": "A hospital monitoring system receives heart-rate readings from a patient-monitoring device.\nThe readings must be processed by a separate thread created using the Runnable interface.\n\nWrite a Java program that implements Runnable and creates a thread to display each heart-\nrate reading.\n\nInput Format\n\nThe first line contains the number of readings.\n\nThe second line contains N heart-rate readings separated by spaces.\n\nOutput Format\n\nFor every reading, print:\n\nMonitoring: <reading>\n\nEach reading should be printed on a separate line.\n\nCode Constraints\n\n1 ≤ N ≤ 100\n40 ≤ Reading ≤ 200", "input": "3\n72 80 76", "output": "Monitoring: 72\nMonitoring: 80\nMonitoring: 76", "solution": "import java.util.*;\n\npublic class Main {\n    static class Monitor implements Runnable {\n        private final int[] readings;\n\n        Monitor(int[] readings) {\n            this.readings = readings;\n        }\n\n        public void run() {\n            for (int reading : readings)\n                System.out.println(\"Monitoring: \" + reading);\n        }\n    }\n\n    public static void main(String[] args) throws InterruptedException {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        int[] readings = new int[n];\n\n        for (int i = 0; i < n; i++) readings[i] = sc.nextInt();\n\n        Thread thread = new Thread(new Monitor(readings));\n        thread.start();\n        thread.join();\n    }\n}", "sourceHasSql": false}, {"id": 52, "topic": "Multithreading", "description": "A bank account is accessed by two withdrawal requests running in separate threads. Both\nrequests operate on the same account balance.\nWrite a Java program using a synchronized withdrawal method so that only one thread can\nmodify the account balance at a time.\n\nIf sufficient balance is available, the amount should be withdrawn. Otherwise, print\nInsufficient Balance.\n\nInput Format\n\nThe first line contains the initial account balance.\n\nThe second line contains the withdrawal amount requested by the first thread.\n\nThe third line contains the withdrawal amount requested by the second thread.\n\nOutput Format\n\nIf a withdrawal cannot be completed, print Insufficient Balance.\n\nAfter both threads finish, print:\n\nFinal Balance: <balance>\n\nCode Constraints\n\n0 ≤ Balance ≤ 1000000\n0 ≤ Withdrawal Amount ≤ 1000000", "input": "10000\n3000\n4000", "output": "Final Balance: 3000", "solution": "import java.util.*;\n\nclass BankAccount {\n    private long balance;\n\n    BankAccount(long balance) {\n        this.balance = balance;\n    }\n\n    synchronized void withdraw(long amount) {\n        if (amount <= balance) {\n            balance -= amount;\n        } else {\n            System.out.println(\"Insufficient Balance\");\n        }\n    }\n\n    long getBalance() {\n        return balance;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Scanner sc = new Scanner(System.in);\n\n        BankAccount account = new BankAccount(sc.nextLong());\n        long w1 = sc.nextLong();\n        long w2 = sc.nextLong();\n\n        Thread t1 = new Thread(() -> account.withdraw(w1));\n        Thread t2 = new Thread(() -> account.withdraw(w2));\n\n        t1.start();\n        t2.start();\n        t1.join();\n        t2.join();\n\n        System.out.println(\"Final Balance: \" + account.getBalance());\n    }\n}", "sourceHasSql": false}, {"id": 53, "topic": "Multithreading", "description": "A movie-ticket booking system maintains a shared number of available tickets. Two booking\nthreads attempt to reserve tickets simultaneously.\n\nWrite a Java program that uses a synchronized block to protect the critical section where\ntickets are booked.\n\nEach successful booking decreases the available ticket count by one. If there are not enough\ntickets, no additional tickets should be booked.\n\nInput Format\n\nThe first line contains the initial number of tickets.\nThe second line contains the number of booking requests.\n\nOutput Format\n\nPrint:\n\nTickets Remaining: <number>\n\nCode Constraints\n\n0 ≤ Tickets ≤ 10000\n0 ≤ Requests ≤ 10000", "input": "10\n6", "output": "Tickets Remaining: 4", "solution": "import java.util.*;\n\nclass TicketCounter {\n    private int tickets;\n\n    TicketCounter(int tickets) {\n        this.tickets = tickets;\n    }\n\n    void book(int requests) {\n        synchronized (this) {\n            while (requests-- > 0 && tickets > 0)\n                tickets--;\n        }\n    }\n\n    int getTickets() {\n        return tickets;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Scanner sc = new Scanner(System.in);\n\n        TicketCounter counter = new TicketCounter(sc.nextInt());\n        int requests = sc.nextInt();\n\n        Thread t1 = new Thread(() -> counter.book(requests / 2));\n        Thread t2 = new Thread(() -> counter.book(requests - requests / 2));\n\n        t1.start();\n        t2.start();\n        t1.join();\n        t2.join();\n\n        System.out.println(\"Tickets Remaining: \" + counter.getTickets());\n    }\n}", "sourceHasSql": false}, {"id": 54, "topic": "Multithreading", "description": "A website maintains a shared visitor counter. Two threads represent two groups of visitors,\nand each thread increments the same counter.\n\nWithout proper synchronization, simultaneous updates can cause a race condition and\nproduce an incorrect count.\n\nWrite a Java program that safely updates the shared counter using synchronization so that\nevery visitor is counted.\n\nInput Format\n\nThe first line contains the number of visitors handled by the first thread.\n\nThe second line contains the number of visitors handled by the second thread.\n\nOutput Format\n\nPrint:\n\nTotal Visitors: <number>\n\nCode Constraints\n\n0 ≤ N ≤ 100000", "input": "5000\n7000", "output": "Total Visitors: 12000", "solution": "import java.util.*;\n\nclass VisitorCounter {\n    private long count;\n\n    synchronized void increment() {\n        count++;\n    }\n\n    synchronized void addVisitors(int n) {\n        for (int i = 0; i < n; i++) increment();\n    }\n\n    synchronized long getCount() {\n        return count;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Scanner sc = new Scanner(System.in);\n\n        VisitorCounter counter = new VisitorCounter();\n        int n1 = sc.nextInt();\n        int n2 = sc.nextInt();\n\n        Thread t1 = new Thread(() -> counter.addVisitors(n1));\n        Thread t2 = new Thread(() -> counter.addVisitors(n2));\n\n        t1.start();\n        t2.start();\n        t1.join();\n        t2.join();\n\n        System.out.println(\"Total Visitors: \" + counter.getCount());\n    }\n}", "sourceHasSql": false}, {"id": 55, "topic": "Multithreading", "description": "A manufacturing system has two shared resources required by two processing threads. If the\nthreads acquire the resources in different orders, they may wait indefinitely for each other,\nresulting in a deadlock.\n\nWrite a Java program that uses two shared resources and ensures that both threads acquire\nthe resources in the same order. This prevents deadlock and allows both operations to\ncomplete successfully.\n\nInput Format\n\nThe first line contains the number of units processed by Thread 1.\n\nThe second line contains the number of units processed by Thread 2.\n\nOutput Format\n\nPrint:\n\nThread 1 Completed\nThread 2 Completed\nProduction Completed\n\nCode Constraints\n\n1 ≤ N ≤ 1000", "input": "10\n20", "output": "Thread 1 Completed\nThread 2 Completed\nProduction Completed", "solution": "import java.util.*;\n\nclass ResourceWorker implements Runnable {\n    private final Object first;\n    private final Object second;\n    private final int id;\n\n    ResourceWorker(Object first, Object second, int id) {\n        this.first = first;\n        this.second = second;\n        this.id = id;\n    }\n\n    public void run() {\n        synchronized (first) {\n            synchronized (second) {\n                // Both threads acquire resources in the same order.\n            }\n        }\n        System.out.println(\"Thread \" + id + \" Completed\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Scanner sc = new Scanner(System.in);\n        sc.nextInt(); // units for Thread 1\n        sc.nextInt(); // units for Thread 2\n\n        Object resourceA = new Object();\n        Object resourceB = new Object();\n\n        Thread t1 = new Thread(new ResourceWorker(resourceA, resourceB, 1));\n        Thread t2 = new Thread(new ResourceWorker(resourceA, resourceB, 2));\n\n        t1.start();\n        t2.start();\n        t1.join();\n        t2.join();\n\n        System.out.println(\"Production Completed\");\n    }\n}", "sourceHasSql": false}, {"id": 56, "topic": "Multithreading", "description": "A communication system has two threads that need to send messages through a shared\ncommunication channel. The threads repeatedly give way to each other instead of\nproceeding, which can result in a livelock.\n\nWrite a Java program that simulates a limited number of retry attempts. After the specified\nnumber of attempts, the communication should proceed successfully.\nInput Format\n\nThe first line contains the maximum number of retry attempts.\n\nOutput Format\n\nPrint:\n\nCommunication Started\n\nFor every unsuccessful retry, print:\n\nRetrying\n\nWhen communication succeeds, print:\n\nMessage Sent Successfully\nCommunication Completed\n\nCode Constraints\n\n1 ≤ Attempts ≤ 10", "input": "3", "output": "Communication Started\nRetrying\nRetrying\nMessage Sent Successfully\nCommunication Completed", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int attempts = sc.nextInt();\n\n        System.out.println(\"Communication Started\");\n\n        for (int i = 1; i < attempts; i++)\n            System.out.println(\"Retrying\");\n\n        System.out.println(\"Message Sent Successfully\");\n        System.out.println(\"Communication Completed\");\n    }\n}", "sourceHasSql": false}, {"id": 57, "topic": "Multithreading", "description": "An online examination system maintains a shared counter representing the number of\nsubmitted answers. Multiple student threads may submit answers at the same time.\n\nWrite a Java program using a synchronized method to ensure that every submission is\ncounted correctly.\n\nInput Format\n\nThe first line contains the number of submissions from the first group of students.\n\nThe second line contains the number of submissions from the second group.\n\nOutput Format\n\nPrint:\nTotal Submissions: <number>\n\nCode Constraints\n\n0 ≤ N ≤ 100000", "input": "2500\n3500", "output": "Total Submissions: 6000", "solution": "import java.util.*;\n\nclass SubmissionCounter {\n    private long count;\n\n    synchronized void submit() {\n        count++;\n    }\n\n    synchronized long getCount() {\n        return count;\n    }\n\n    void addSubmissions(int n) {\n        for (int i = 0; i < n; i++) submit();\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Scanner sc = new Scanner(System.in);\n        int n1 = sc.nextInt();\n        int n2 = sc.nextInt();\n\n        SubmissionCounter counter = new SubmissionCounter();\n\n        Thread t1 = new Thread(() -> counter.addSubmissions(n1));\n        Thread t2 = new Thread(() -> counter.addSubmissions(n2));\n\n        t1.start();\n        t2.start();\n        t1.join();\n        t2.join();\n\n        System.out.println(\"Total Submissions: \" + counter.getCount());\n    }\n}", "sourceHasSql": false}, {"id": 58, "topic": "Multithreading", "description": "A server receives login requests from multiple threads. Each thread generates a set of login\nIDs, and the IDs must be stored in a thread-safe collection because multiple threads may add\ndata concurrently.\n\nWrite a Java program using a concurrent collection to store the login IDs generated by two\nthreads. After both threads finish, print the total number of stored login records.\n\nInput Format\n\nThe first line contains the number of login records generated by the first thread.\n\nThe second line contains the number of login records generated by the second thread.\n\nOutput Format\n\nPrint:\n\nTotal Login Records: <number>\n\nCode Constraints\n\n0 ≤ N ≤ 100000", "input": "4000\n6000", "output": "Total Login Records: 10000", "solution": "import java.util.*;\nimport java.util.concurrent.ConcurrentLinkedQueue;\n\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Scanner sc = new Scanner(System.in);\n        int n1 = sc.nextInt();\n        int n2 = sc.nextInt();\n\n        ConcurrentLinkedQueue<Integer> logins = new ConcurrentLinkedQueue<>();\n\n        Thread t1 = new Thread(() -> {\n            for (int i = 0; i < n1; i++) logins.add(i);\n        });\n\n        Thread t2 = new Thread(() -> {\n            for (int i = 0; i < n2; i++) logins.add(i);\n        });\n\n        t1.start();\n        t2.start();\n        t1.join();\n        t2.join();\n\n        System.out.println(\"Total Login Records: \" + logins.size());\n    }\n}", "sourceHasSql": false}, {"id": 59, "topic": "Database Concepts", "description": "A university is developing a student management system. The database must store student\ninformation while ensuring that important data follows appropriate rules.\n\nCreate a MySQL table named Students with the following fields:\n\n    •   student_id\n\n    •   student_name\n\n    •   email\n\n    •   age\n\n    •   course\n\nThe table must ensure that student_id is the primary key, student_name cannot be NULL,\nemail is unique, and age must be between 17 and 60.\n\nAfter creating the table, insert the given student records and display all records in ascending\norder of student_id.\n\nInput Format\n\nThe first line contains an integer N, representing the number of students.\n\nThe next N lines contain:\n\nstudent_id student_name email age course\n\nOutput Format\n\nDisplay all student records in ascending order of student_id.\n\nConstraints\n\n    •   1 ≤ N ≤ 100\n\n    •   17 ≤ age ≤ 60\n\n    •   student_id is unique.\n\n    •   Email addresses are unique.\n\n    •   Student names and course names contain no spaces.", "input": "3\n\n101 Amit amit@gmail.com 20 CSE\n\n102 Neha neha@gmail.com 21 ECE\n\n103 Rahul rahul@gmail.com 22 CSE", "output": "101 Amit amit@gmail.com 20 CSE\n\n102 Neha neha@gmail.com 21 ECE\n\n103 Rahul rahul@gmail.com 22 CSE", "solution": "import java.util.*;\n\nclass Student {\n    int id;\n    String name, email, course;\n    int age;\n\n    Student(int id, String name, String email, int age, String course) {\n        this.id = id; this.name = name; this.email = email;\n        this.age = age; this.course = course;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        List<Student> students = new ArrayList<>();\n\n        for (int i = 0; i < n; i++)\n            students.add(new Student(sc.nextInt(), sc.next(), sc.next(), sc.nextInt(), sc.next()));\n\n        students.sort(Comparator.comparingInt(s -> s.id));\n\n        for (Student s : students)\n            System.out.println(s.id + \" \" + s.name + \" \" + s.email + \" \" + s.age + \" \" + s.course);\n    }\n}", "sourceHasSql": true}, {"id": 60, "topic": "Database Concepts", "description": "A company maintains employee records containing employee ID, employee name,\ndepartment, and salary. The management wants to provide a 10% salary increment to all\nemployees working in the CSE department.\n\nUpdate the salary of every CSE employee by 10% and display the employee name,\ndepartment, and updated salary.\n\nInput Format\n\nThe first line contains an integer N, representing the number of employees.\n\nThe next N lines contain:\n\nemployee_id employee_name department salary\n\nThe final line contains the department for which the salary increment must be applied.\n\nOutput Format\n\nDisplay:\n\nemployee_name department updated_salary\n\nfor all employees in ascending order of employee_id.\n\nConstraints\n\n    •   1 ≤ N ≤ 100\n\n    •   Salary is a positive integer.\n\n    •   Employee names and department names contain no spaces.\n\n    •   The increment is exactly 10%.", "input": "4\n\n101 Amit CSE 50000\n\n102 Neha ECE 45000\n\n103 Rahul CSE 60000\n104 Simran IT 55000\n\nCSE", "output": "Amit CSE 55000.00\n\nNeha ECE 45000.00\n\nRahul CSE 66000.00\n\nSimran IT 55000.00", "solution": "import java.util.*;\n\nclass Employee {\n    int id;\n    String name, department;\n    double salary;\n\n    Employee(int id, String name, String department, double salary) {\n        this.id = id; this.name = name; this.department = department; this.salary = salary;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        List<Employee> employees = new ArrayList<>();\n\n        for (int i = 0; i < n; i++)\n            employees.add(new Employee(sc.nextInt(), sc.next(), sc.next(), sc.nextDouble()));\n\n        String targetDept = sc.next();\n        employees.sort(Comparator.comparingInt(e -> e.id));\n\n        for (Employee e : employees) {\n            if (e.department.equals(targetDept))\n                e.salary *= 1.10;\n            System.out.printf(\"%s %s %.2f%n\", e.name, e.department, e.salary);\n        }\n    }\n}", "sourceHasSql": true}, {"id": 61, "topic": "Database Concepts", "description": "A library maintains details of its books, including book ID, title, author, and price. The\nlibrarian wants to remove all books whose price is below a specified minimum price.\n\nDelete all books whose price is less than the given minimum price and display the remaining\nbooks in ascending order of book_id.\n\nInput Format\n\nThe first line contains an integer N, representing the number of books.\n\nThe next N lines contain:\n\nbook_id title author price\n\nThe final line contains the minimum acceptable price.\n\nOutput Format\n\nDisplay the remaining books as:\n\nbook_id title author price\n\nin ascending order of book_id.\n\nConstraints\n\n      •   1 ≤ N ≤ 100\n\n      •   Price is a positive integer.\n\n      •   Book titles and author names contain no spaces.", "input": "5\n\n101 Java James 550\n\n102 SQL Korth 250\n103 Python Rossum 650\n\n104 Networks Tanenbaum 300\n\n105 OS Galvin 200\n\n300", "output": "101 Java James 550\n\n103 Python Rossum 650\n\n104 Networks Tanenbaum 300", "solution": "import java.util.*;\n\nclass Book {\n    int id, price;\n    String title, author;\n\n    Book(int id, String title, String author, int price) {\n        this.id = id; this.title = title; this.author = author; this.price = price;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        List<Book> books = new ArrayList<>();\n\n        for (int i = 0; i < n; i++)\n            books.add(new Book(sc.nextInt(), sc.next(), sc.next(), sc.nextInt()));\n\n        int minPrice = sc.nextInt();\n\n        books.removeIf(b -> b.price < minPrice);\n        books.sort(Comparator.comparingInt(b -> b.id));\n\n        for (Book b : books)\n            System.out.println(b.id + \" \" + b.title + \" \" + b.author + \" \" + b.price);\n    }\n}", "sourceHasSql": true}, {"id": 62, "topic": "Database Concepts", "description": "A university stores student information along with the department in which each student is\nenrolled. The administration wants to know how many students belong to each department.\n\nWrite a MySQL query that groups students according to their department and calculates the\nnumber of students in each department.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe next N lines contain:\n\nstudent_id student_name department\n\nOutput Format\n\nDisplay:\n\ndepartment student_count\n\nin alphabetical order of department.\n\nConstraints\n\n    •   1 ≤ N ≤ 100\n\n    •   Each student belongs to one department.\n\n    •   Department names contain no spaces.", "input": "6\n\n101 Amit CSE\n\n102 Neha ECE\n103 Rahul CSE\n\n104 Simran IT\n\n105 Karan CSE\n\n106 Priya ECE", "output": "CSE 3\n\nECE 2\n\nIT 1", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        TreeMap<String, Integer> count = new TreeMap<>();\n\n        for (int i = 0; i < n; i++) {\n            sc.nextInt(); // student ID\n            sc.next();    // student name\n            String dept = sc.next();\n            count.put(dept, count.getOrDefault(dept, 0) + 1);\n        }\n\n        for (Map.Entry<String, Integer> e : count.entrySet())\n            System.out.println(e.getKey() + \" \" + e.getValue());\n    }\n}", "sourceHasSql": true}, {"id": 63, "topic": "Database Concepts", "description": "An online shopping system stores orders placed by customers. The company wants to\ncalculate the total amount spent by each customer.\n\nWrite a MySQL query that groups the orders by customer and calculates the total order\namount for every customer.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe next N lines contain:\n\norder_id customer_id amount\n\nOutput Format\n\nDisplay:\n\ncustomer_id total_amount\n\nin ascending order of customer_id.\n\nConstraints\n\n       •   1 ≤ N ≤ 100\n\n       •   Amount is a positive integer.", "input": "5\n\n1 101 1200\n\n2 102 800\n\n3 101 1500\n4 103 2000\n\n5 102 700", "output": "101 2700\n\n102 1500\n\n103 2000", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        TreeMap<Integer, Long> totals = new TreeMap<>();\n\n        for (int i = 0; i < n; i++) {\n            sc.nextInt(); // order ID\n            int customer = sc.nextInt();\n            long amount = sc.nextLong();\n            totals.put(customer, totals.getOrDefault(customer, 0L) + amount);\n        }\n\n        for (Map.Entry<Integer, Long> e : totals.entrySet())\n            System.out.println(e.getKey() + \" \" + e.getValue());\n    }\n}", "sourceHasSql": true}, {"id": 64, "topic": "Database Concepts", "description": "A university maintains examination marks for different subjects. The examination\ndepartment wants to calculate the average marks obtained in each subject.\n\nWrite a MySQL query that groups the records by subject and calculates the average marks.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe next N lines contain:\n\nstudent_id subject marks\n\nOutput Format\n\nDisplay:\n\nsubject average_marks\n\nwith the average rounded to two decimal places. Display subjects in alphabetical order.\n\nConstraints\n\n    •   1 ≤ N ≤ 100\n\n    •   0 ≤ marks ≤ 100\n\n    •   Subject names contain no spaces.", "input": "6\n\n101 Java 80\n\n102 Java 90\n\n103 DBMS 70\n\n104 DBMS 80\n105 Java 100\n\n106 DBMS 90", "output": "DBMS 80.00\n\nJava 90.00", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        TreeMap<String, List<Integer>> marks = new TreeMap<>();\n\n        for (int i = 0; i < n; i++) {\n            sc.nextInt(); // student ID\n            String subject = sc.next();\n            int mark = sc.nextInt();\n            marks.computeIfAbsent(subject, k -> new ArrayList<>()).add(mark);\n        }\n\n        for (Map.Entry<String, List<Integer>> e : marks.entrySet()) {\n            double avg = e.getValue().stream().mapToInt(Integer::intValue).average().orElse(0);\n            System.out.printf(\"%s %.2f%n\", e.getKey(), avg);\n        }\n    }\n}", "sourceHasSql": true}, {"id": 65, "topic": "Database Concepts", "description": "An online shopping company wants to identify customers who have placed at least three\norders.\n\nWrite a MySQL query that groups orders by customer and displays only those customers\nwhose total number of orders is three or more.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe next N lines contain:\n\norder_id customer_id amount\n\nOutput Format\n\nDisplay:\n\ncustomer_id order_count\n\nfor customers having at least three orders.\n\nConstraints\n\n    •   1 ≤ N ≤ 200\n\n    •   Order IDs are unique.\n\n    •   Customer IDs are positive integers.", "input": "7\n\n1 101 500\n\n2 102 700\n\n3 101 400\n\n4 103 900\n\n5 101 600\n6 102 300\n\n7 101 800", "output": "101 4", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        TreeMap<Integer, Integer> counts = new TreeMap<>();\n\n        for (int i = 0; i < n; i++) {\n            sc.nextInt(); // order ID\n            int customer = sc.nextInt();\n            sc.nextInt(); // amount\n            counts.put(customer, counts.getOrDefault(customer, 0) + 1);\n        }\n\n        for (Map.Entry<Integer, Integer> e : counts.entrySet())\n            if (e.getValue() >= 3)\n                System.out.println(e.getKey() + \" \" + e.getValue());\n    }\n}", "sourceHasSql": true}, {"id": 66, "topic": "Database Concepts", "description": "A company wants to identify employees whose salary is greater than the average salary of all\nemployees.\n\nWrite a MySQL query using a nested query to find these employees.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe next N lines contain:\n\nemployee_id employee_name salary\n\nOutput Format\n\nDisplay:\n\nemployee_name salary\n\nfor employees whose salary is greater than the overall average salary. Display them in\ndescending order of salary.\n\nConstraints\n\n    •   1 ≤ N ≤ 100\n\n    •   Salary is a positive integer.\n\n    •   Employee names contain no spaces.", "input": "5\n\n101 Amit 40000\n\n102 Neha 60000\n\n103 Rahul 50000\n\n104 Simran 80000\n\n105 Karan 30000", "output": "Simran 80000\n\nNeha 60000", "solution": "import java.util.*;\n\nclass Employee {\n    int id;\n    String name;\n    long salary;\n\n    Employee(int id, String name, long salary) {\n        this.id = id; this.name = name; this.salary = salary;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        List<Employee> employees = new ArrayList<>();\n        long total = 0;\n\n        for (int i = 0; i < n; i++) {\n            Employee e = new Employee(sc.nextInt(), sc.next(), sc.nextLong());\n            employees.add(e);\n            total += e.salary;\n        }\n\n        double average = (double) total / n;\n\n        employees.removeIf(e -> e.salary <= average);\n        employees.sort((a, b) -> Long.compare(b.salary, a.salary));\n\n        for (Employee e : employees)\n            System.out.println(e.name + \" \" + e.salary);\n    }\n}", "sourceHasSql": true}, {"id": 67, "topic": "Database Concepts", "description": "A university stores student details in one table and department details in another table.\n\nThe Students table contains student information and Departments contains department\ninformation. Write a MySQL query using an inner join to display each student's name along\nwith the corresponding department name.\n\nInput Format\n\nThe database contains the following information:\n\nStudents\n\nstudent_id\n\nstudent_name\n\ndepartment_id\n\nDepartments\n\ndepartment_id\n\ndepartment_name\n\nOutput Format\n\nDisplay:\n\nstudent_name department_name\n\nin ascending order of student_id.\n\nConstraints\n\n   •   Every student has a valid department.\n\n   •   department_id uniquely identifies a department.", "input": "Students\n\n101 Amit 10\n\n102 Neha 20\n\n103 Rahul 10\nDepartments\n\n10 CSE\n\n20 ECE", "output": "Amit CSE\n\nNeha ECE\n\nRahul CSE", "solution": "import java.util.*;\n\nclass Student {\n    int id, departmentId;\n    String name;\n    Student(int id, String name, int departmentId) {\n        this.id = id; this.name = name; this.departmentId = departmentId;\n    }\n}\n\nclass Department {\n    int id;\n    String name;\n    Department(int id, String name) {\n        this.id = id; this.name = name;\n    }\n}\n\npublic class Main {\n    // Java equivalent of the source's INNER JOIN.\n    static void innerJoin(List<Student> students, List<Department> departments) {\n        departments.sort(Comparator.comparingInt(d -> d.id));\n\n        for (Student s : students) {\n            for (Department d : departments) {\n                if (s.departmentId == d.id) {\n                    System.out.println(s.name + \" \" + d.name);\n                    break;\n                }\n            }\n        }\n    }\n\n    public static void main(String[] args) {\n        List<Student> students = Arrays.asList(\n                new Student(101, \"Amit\", 10),\n                new Student(102, \"Neha\", 20),\n                new Student(103, \"Rahul\", 10)\n        );\n\n        List<Department> departments = Arrays.asList(\n                new Department(10, \"CSE\"),\n                new Department(20, \"ECE\")\n        );\n\n        innerJoin(students, departments);\n    }\n}", "sourceHasSql": true}, {"id": 68, "topic": "Database Concepts", "description": "A company wants to generate a report containing every employee, including employees who\nhave not yet been assigned to a department.\n\nWrite a MySQL query using a left join to display the employee name and department name.\nIf an employee has no department, the department value should appear as NULL.\n\nInput Format\n\nThe database contains:\n\nEmployees\n\nemployee_id\n\nemployee_name\n\ndepartment_id\n\nDepartments\n\ndepartment_id\n\ndepartment_name\n\nOutput Format\n\nDisplay:\n\nemployee_name department_name\n\nin ascending order of employee_id.", "input": "Employees\n101 Amit 10\n\n102 Neha NULL\n\n103 Rahul 20\n\nDepartments\n\n10 CSE\n\n20 ECE", "output": "Amit CSE\n\nNeha NULL\n\nRahul ECE", "solution": "import java.util.*;\n\nclass Employee {\n    int id, departmentId;\n    String name;\n    Employee(int id, String name, int departmentId) {\n        this.id = id; this.name = name; this.departmentId = departmentId;\n    }\n}\n\nclass Department {\n    int id;\n    String name;\n    Department(int id, String name) {\n        this.id = id; this.name = name;\n    }\n}\n\npublic class Main {\n    // Java equivalent of the source's LEFT JOIN.\n    static void leftJoin(List<Employee> employees, List<Department> departments) {\n        employees.sort(Comparator.comparingInt(e -> e.id));\n\n        for (Employee e : employees) {\n            String department = \"NULL\";\n\n            for (Department d : departments) {\n                if (e.departmentId == d.id) {\n                    department = d.name;\n                    break;\n                }\n            }\n\n            System.out.println(e.name + \" \" + department);\n        }\n    }\n\n    public static void main(String[] args) {\n        List<Employee> employees = Arrays.asList(\n                new Employee(101, \"Amit\", 10),\n                new Employee(102, \"Neha\", -1),\n                new Employee(103, \"Rahul\", 20)\n        );\n\n        List<Department> departments = Arrays.asList(\n                new Department(10, \"CSE\"),\n                new Department(20, \"ECE\")\n        );\n\n        leftJoin(employees, departments);\n    }\n}", "sourceHasSql": true}, {"id": 69, "topic": "Database Concepts", "description": "A company stores managers and employees in the same Employees table. Each employee\nrecord contains the ID of their manager.\n\nWrite a MySQL query using a self join to display every employee along with the name of\ntheir manager.\n\nEmployees who do not have a manager should also be included.\n\nInput Format\n\nThe database contains:\n\nemployee_id\n\nemployee_name\n\nmanager_id\n\nOutput Format\n\nDisplay:\n\nemployee_name manager_name\n\nin ascending order of employee ID.", "input": "101 Amit NULL\n\n102 Neha 101\n103 Rahul 101\n\n104 Simran 102", "output": "Amit NULL\n\nNeha Amit\n\nRahul Amit\n\nSimran Neha", "solution": "import java.util.*;\n\nclass Employee {\n    int id, managerId;\n    String name;\n\n    Employee(int id, String name, int managerId) {\n        this.id = id; this.name = name; this.managerId = managerId;\n    }\n}\n\npublic class Main {\n    // Java equivalent of the source's SELF JOIN.\n    static void selfJoin(List<Employee> employees) {\n        employees.sort(Comparator.comparingInt(e -> e.id));\n\n        for (Employee e : employees) {\n            String managerName = \"NULL\";\n\n            for (Employee manager : employees) {\n                if (e.managerId == manager.id) {\n                    managerName = manager.name;\n                    break;\n                }\n            }\n\n            System.out.println(e.name + \" \" + managerName);\n        }\n    }\n\n    public static void main(String[] args) {\n        List<Employee> employees = Arrays.asList(\n                new Employee(101, \"Amit\", -1),\n                new Employee(102, \"Neha\", 101),\n                new Employee(103, \"Rahul\", 101),\n                new Employee(104, \"Simran\", 102)\n        );\n\n        selfJoin(employees);\n    }\n}", "sourceHasSql": true}, {"id": 70, "topic": "Database Concepts", "description": "An online store wants to find the product or products having the highest price.\n\nWrite a MySQL query using a subquery to display all products whose price is equal to the\nmaximum product price.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe next N lines contain:\n\nproduct_id product_name price\n\nOutput Format\n\nDisplay:\n\nproduct_name price\n\nfor every product having the maximum price.\n\nConstraints\n\n    •   1 ≤ N ≤ 100\n\n    •   Price is a positive integer.\n\n    •   More than one product may have the same maximum price.", "input": "5\n\n101 Laptop 60000\n\n102 Phone 40000\n\n103 Monitor 15000\n104 Tablet 30000\n\n105 Camera 60000", "output": "Laptop 60000\n\nCamera 60000", "solution": "import java.util.*;\n\nclass Product {\n    int id, price;\n    String name;\n\n    Product(int id, String name, int price) {\n        this.id = id; this.name = name; this.price = price;\n    }\n}\n\npublic class Main {\n    // Java equivalent of the source's MAX-price subquery.\n    static void printMaxPricedProducts(List<Product> products) {\n        int maxPrice = products.stream()\n                .mapToInt(p -> p.price)\n                .max()\n                .orElse(Integer.MIN_VALUE);\n\n        for (Product p : products)\n            if (p.price == maxPrice)\n                System.out.println(p.name + \" \" + p.price);\n    }\n\n    public static void main(String[] args) {\n        List<Product> products = Arrays.asList(\n                new Product(101, \"Laptop\", 60000),\n                new Product(102, \"Phone\", 40000),\n                new Product(103, \"Monitor\", 15000),\n                new Product(104, \"Tablet\", 30000),\n                new Product(105, \"Camera\", 60000)\n        );\n\n        printMaxPricedProducts(products);\n    }\n}", "sourceHasSql": true}];
const state = {
  current: 1,
  topic: "All",
  search: "",
  reviewed: JSON.parse(localStorage.getItem("chalkpad-reviewed") || "[]")
};

const topics = ["All", ...new Set(DATA.map(q => q.topic))];

function save() {
  localStorage.setItem("chalkpad-reviewed", JSON.stringify(state.reviewed));
}
function isReviewed(id) { return state.reviewed.includes(id); }

function renderFilters() {
  const el = document.getElementById("filters");
  el.innerHTML = topics.map(t => `<button class="filter ${state.topic===t?'active':''}" data-topic="${t}">${t}</button>`).join("");
  el.querySelectorAll(".filter").forEach(b => b.onclick = () => {
    state.topic = b.dataset.topic;
    const first = filtered()[0];
    if (first) state.current = first.id;
    render();
  });
}

function filtered() {
  const s = state.search.toLowerCase().trim();
  return DATA.filter(q =>
    (state.topic === "All" || q.topic === state.topic) &&
    (!s || (`Q${q.id} ${q.topic} ${q.description}`).toLowerCase().includes(s))
  );
}

function renderQNav() {
  const list = filtered();
  const el = document.getElementById("qnav");
  el.innerHTML = list.map(q => `<button class="qbtn ${q.id===state.current?'current':''} ${isReviewed(q.id)?'done':''}" data-id="${q.id}">${q.id}</button>`).join("");
  el.querySelectorAll(".qbtn").forEach(b => b.onclick = () => {
    state.current = Number(b.dataset.id);
    render();
  });
}

function renderViewer() {
  const q = DATA.find(x => x.id === state.current) || filtered()[0];
  const viewer = document.getElementById("viewer");
  if (!q) { viewer.innerHTML = `<div class="card empty">No matching questions.</div>`; return; }

  const sqlNote = q.sourceHasSql
    ? `<div class="note"><b>Source note:</b> Questions 59–70 in the uploaded set are database/MySQL tasks. This LMS keeps the requested Java-only mode; for 67–70 the editor contains a Java equivalent/method-style solution rather than a MySQL statement.</div>`
    : "";

  viewer.innerHTML = `
    <article class="card">
      <div class="meta">
        <span class="pill">Question ${q.id} / 70</span>
        <span class="pill">${q.topic}</span>
        <span class="pill">${isReviewed(q.id) ? "Reviewed ✓" : "Not reviewed"}</span>
      </div>
      <div class="content">
        ${sqlNote}
        <div class="section">
          <h3>PROBLEM</h3>
          <div class="problem">${escapeHtml(q.description)}</div>
        </div>

        <div class="section">
          <h3>SAMPLE TEST CASE</h3>
          <div class="testgrid">
            <div class="test"><div class="codehead"><span>Input</span><button class="action copy" data-copy="${encodeURIComponent(q.input)}">Copy</button></div><pre>${escapeHtml(q.input || "No sample input supplied")}</pre></div>
            <div class="test"><div class="codehead"><span>Expected output</span><button class="action copy" data-copy="${encodeURIComponent(q.output)}">Copy</button></div><pre>${escapeHtml(q.output || "No sample output supplied")}</pre></div>
          </div>
        </div>

        <div class="section">
          <div class="codehead"><h3>JAVA REFERENCE SOLUTION</h3><button class="action copy" data-copy="${encodeURIComponent(q.solution)}">Copy Java</button></div>
          <pre><code class="language-java">${escapeHtml(q.solution)}</code></pre>
        </div>
      </div>
    </article>
    <div class="navrow">
      <button class="action" id="prev2">← Previous</button>
      <button class="action" id="next2">Next →</button>
    </div>`;
  document.querySelectorAll("pre code").forEach(el => { if (window.hljs) hljs.highlightElement(el); });
  document.querySelectorAll(".copy").forEach(btn => btn.onclick = async () => {
    await navigator.clipboard.writeText(decodeURIComponent(btn.dataset.copy));
    const old = btn.textContent; btn.textContent = "Copied ✓";
    setTimeout(() => btn.textContent = old, 900);
  });
  document.getElementById("prev2").onclick = previous;
  document.getElementById("next2").onclick = next;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function updateProgress() {
  const count = state.reviewed.length;
  document.getElementById("progressText").textContent = `${count} / 70`;
  document.getElementById("progressBar").style.width = `${count/70*100}%`;
}

function previous() {
  const list = filtered();
  if (!list.length) return;
  let i = list.findIndex(q => q.id === state.current);
  i = (i - 1 + list.length) % list.length;
  state.current = list[i].id;
  render();
}
function next() {
  const list = filtered();
  if (!list.length) return;
  let i = list.findIndex(q => q.id === state.current);
  i = (i + 1) % list.length;
  state.current = list[i].id;
  render();
}

function render() {
  renderFilters();
  renderQNav();
  renderViewer();
  updateProgress();
}

document.getElementById("search").addEventListener("input", e => {
  state.search = e.target.value;
  const list = filtered();
  if (list.length && !list.some(q => q.id === state.current)) state.current = list[0].id;
  render();
});
document.getElementById("prev").onclick = previous;
document.getElementById("next").onclick = next;
document.getElementById("mark").onclick = () => {
  if (!isReviewed(state.current)) state.reviewed.push(state.current);
  else state.reviewed = state.reviewed.filter(x => x !== state.current);
  save(); render();
};
document.getElementById("reset").onclick = () => {
  if (confirm("Reset all reviewed questions?")) { state.reviewed = []; save(); render(); }
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") previous();
  if (e.key.toLowerCase() === "m") document.getElementById("mark").click();
});
render();
</script>
