<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap");

:root {
  --bg:#08070b; --panel:#131019; --panel2:#191420; --text:#e2dce8;
  --muted:#8d84a0; --accent:#b8873c; --accent2:#e7c98a; --accent3:#7a5a9e;
  --border:#2c2436; --code:#0a0810; --good:#8ea87c; --shadow:rgba(0,0,0,.6);
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%;
  background:
    radial-gradient(ellipse 60% 40% at 12% -5%, rgba(122,90,158,.16) 0%, transparent 60%),
    radial-gradient(ellipse 50% 35% at 100% 10%, rgba(184,135,60,.08) 0%, transparent 65%),
    radial-gradient(circle at 50% 100%, #12101a 0%, #08070b 55%, #050408 100%);
  color:var(--text); font-family:"EB Garamond",Georgia,"Times New Roman",serif; font-size:16px;
}
body { overflow-x:hidden; }
body::before {
  content:""; position:fixed; inset:-15%; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 40% 22% at 20% 30%, rgba(226,220,232,.05) 0%, transparent 70%),
    radial-gradient(ellipse 35% 20% at 75% 65%, rgba(226,220,232,.04) 0%, transparent 70%),
    radial-gradient(ellipse 45% 25% at 50% 90%, rgba(184,135,60,.05) 0%, transparent 75%);
  filter:blur(6px);
  animation:mist 26s ease-in-out infinite alternate;
}
body::after {
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background:linear-gradient(120deg,transparent 0 48%,rgba(200,190,215,.05) 49%,transparent 50% 100%);
  background-size:3px 140px; animation:drizzle 2.6s linear infinite;
}
@keyframes mist { 0%{ transform:translate(-2%,-1%) scale(1); } 100%{ transform:translate(2%,2%) scale(1.06); } }
@keyframes drizzle { from{ background-position:0 -140px; } to{ background-position:0 0; } }
@keyframes flicker { 0%,19%,21%,23%,54%,56%,100%{ opacity:1; } 20%,22%,55%{ opacity:.72; } }
.app { position:relative; z-index:1; display:grid; grid-template-columns:280px 1fr; min-height:100vh; }
.sidebar { position:sticky; top:0; height:100vh; padding:24px 17px; background:linear-gradient(180deg,rgba(19,16,25,.92),rgba(8,7,11,.92)); backdrop-filter:blur(16px); border-right:1px solid var(--border); overflow:auto; box-shadow:inset -1px 0 0 rgba(122,90,158,.12); }
.brand { font-family:"Cinzel",serif; font-weight:600; letter-spacing:.05em; font-size:19px; color:var(--accent2); text-shadow:0 0 14px rgba(184,135,60,.35); animation:flicker 7s infinite; }
.brand small { display:block; margin-top:6px; color:var(--muted); font-size:11px; font-weight:500; font-family:"EB Garamond",serif; letter-spacing:.05em; text-transform:uppercase; }
.progressbox { margin:22px 0; padding:14px; border:1px solid var(--border); border-radius:4px; background:rgba(25,20,32,.65); position:relative; }
.progressbox::before { content:"❦"; position:absolute; top:-11px; left:14px; background:var(--bg); padding:0 6px; color:var(--accent); font-size:13px; }
.progressline { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-bottom:8px; letter-spacing:.03em; }
.bar { height:6px; border-radius:2px; background:#100d16; overflow:hidden; border:1px solid var(--border); }
.bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent3),var(--accent)); transition:.25s; }
.search { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:4px; background:#0d0b13; color:var(--text); outline:none; font-family:"EB Garamond",serif; font-size:14px; }
.search:focus { border-color:var(--accent3); }
.filters { margin-top:12px; display:grid; gap:6px; }
.filter { text-align:left; padding:9px 10px; border:1px solid transparent; background:transparent; color:var(--muted); border-radius:3px; cursor:pointer; font-family:"EB Garamond",serif; font-size:14px; letter-spacing:.02em; }
.filter.active,.filter:hover { background:#181320; color:var(--accent2); border-color:var(--border); }
.qnav { margin-top:14px; display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
.qbtn { border:1px solid var(--border); background:#0d0b13; color:var(--muted); border-radius:3px; padding:6px 0; cursor:pointer; font-size:11px; font-family:"EB Garamond",serif; }
.qbtn.done { color:var(--good); border-color:#3a4a34; }
.qbtn.current { background:#241a30; color:var(--accent2); border-color:var(--accent3); }
.main { min-width:0; padding:28px clamp(18px,4vw,55px) 70px; max-width:1200px; width:100%; margin:auto; }
.top { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:20px; }
.kicker { color:var(--accent); text-transform:uppercase; font-size:11px; letter-spacing:.2em; font-weight:700; font-family:"Cinzel",serif; }
h1 { margin:6px 0 6px; font-size:clamp(26px,4vw,44px); line-height:1.1; font-family:"Cinzel",serif; font-weight:600; color:var(--text); text-shadow:0 2px 20px rgba(122,90,158,.25); }
.sub { color:var(--muted); max-width:750px; font-size:15.5px; line-height:1.55; }
.controls { display:flex; gap:8px; flex-wrap:wrap; }
button { font:inherit; }
.action { border:1px solid var(--border); background:#161120; color:var(--text); padding:9px 13px; border-radius:4px; cursor:pointer; font-family:"EB Garamond",serif; font-size:14px; letter-spacing:.02em; transition:.15s; }
.action:hover { background:#211930; border-color:var(--accent3); color:var(--accent2); }
.card { border:1px solid var(--border); border-radius:6px; background:linear-gradient(180deg,rgba(19,16,25,.92),rgba(15,12,20,.92)); box-shadow:0 18px 50px var(--shadow), inset 0 1px 0 rgba(226,220,232,.03); overflow:hidden; position:relative; }
.card::before { content:""; position:absolute; inset:0; border:1px solid rgba(184,135,60,.08); border-radius:6px; pointer-events:none; margin:5px; }
.meta { display:flex; flex-wrap:wrap; gap:7px; padding:17px 19px 0; }
.pill { padding:5px 10px; border-radius:3px; border:1px solid var(--border); color:var(--muted); font-size:11px; letter-spacing:.03em; background:rgba(24,19,32,.6); }
.content { padding:19px; }
.problem { line-height:1.7; white-space:pre-wrap; color:#dcd6e5; font-size:15px; }
.problem strong { color:var(--accent2); }
.section { margin-top:24px; }
.section h3 { margin:0 0 10px; font-size:12.5px; color:var(--accent2); letter-spacing:.12em; font-family:"Cinzel",serif; font-weight:600; }
.section h3::before { content:"◆ "; color:var(--accent); font-size:9px; vertical-align:middle; }
pre { margin:0; white-space:pre-wrap; overflow:auto; background:var(--code); border:1px solid #201a2a; border-radius:5px; padding:16px; line-height:1.55; font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; color:#d3cbe0; }
pre code { background:none; color:inherit; font:inherit; padding:0; }
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-operator { color:#b98ee0; font-weight:600; }
.hljs-string,.hljs-regexp { color:#e0a458; }
.hljs-comment,.hljs-quote { color:#756b8a; font-style:italic; }
.hljs-number { color:#8ea87c; }
.hljs-title.function_,.hljs-title.class_,.hljs-built_in,.hljs-title { color:#e7c98a; }
.hljs-type,.hljs-class .hljs-title { color:#7dc2c9; }
.hljs-params,.hljs-variable { color:#d3cbe0; }
.hljs-meta,.hljs-meta .hljs-keyword { color:#8a7fa6; }
.hljs-punctuation { color:#a89bc2; }
.codehead { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
.testgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.test { min-width:0; }
.note { padding:12px 14px; border-left:3px solid var(--accent); background:#120f18; color:var(--muted); border-radius:2px; font-size:12px; line-height:1.5; }
.navrow { display:flex; justify-content:space-between; gap:8px; margin-top:14px; }
.hidden { display:none !important; }
.empty { padding:40px; text-align:center; color:var(--muted); font-family:"Cinzel",serif; letter-spacing:.05em; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:#241d2e; border-radius:5px; border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background:var(--accent3); }
@media(max-width:850px) {
  .app { grid-template-columns:1fr; }
  .sidebar { position:relative; height:auto; border-right:0; border-bottom:1px solid var(--border); }
  .qnav { grid-template-columns:repeat(10,1fr); }
  .testgrid { grid-template-columns:1fr; }
  .top { flex-direction:column; }
}

<script>
const DATA = [{"id": 1, "topic": "Core Java", "description": "A financial application calculates the final amount payable by a customer after applying a\ndiscount and a service charge. The application receives the original amount as an integer\nand the discount and service charge as decimal percentages.\n\nThe final amount is calculated as:\n\nFinal Amount = Original Amount − Discount + Service Charge\n\nwhere:\n\nDiscount = Original Amount × Discount Percentage / 100\n\nService Charge = Amount after Discount × Service Charge Percentage / 100\n\nWrite a Java program to calculate and display the final amount rounded to two decimal\nplaces. The program should use appropriate primitive data types to avoid loss of decimal\nprecision during the calculation.\n\nInput Format\n\nThe first line contains an integer representing the original amount.\n\nThe second line contains a decimal value representing the discount percentage.\n\nThe third line contains a decimal value representing the service charge percentage.\n\nOutput Format\n\nPrint the final amount rounded to two decimal places.\n\nCode Constraints\n\n1 ≤ Original Amount ≤ 1000000\n0 ≤ Discount Percentage ≤ 100\n0 ≤ Service Charge Percentage ≤ 20", "input": "5000\n\n10.5\n\n5.0", "output": "4712.50", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n\n        int original = sc.nextInt();\n        double discountPct = sc.nextDouble();\n        double servicePct = sc.nextDouble();\n\n        double discount = original * discountPct / 100.0;\n        double afterDiscount = original - discount;\n        double serviceCharge = afterDiscount * servicePct / 100.0;\n        double finalAmount = afterDiscount + serviceCharge;\n\n        System.out.printf(\"%.2f%n\", finalAmount);\n    }\n}", "sourceHasSql": false}, {"id": 2, "topic": "Core Java", "description": "A manufacturing system records the number of products produced during N shifts. To\nidentify production performance, the system calculates the total production, average\nproduction, and the difference between the highest and lowest production values.\n\nWrite a Java program to read the production values into an integer array and calculate these\nthree values. The average production should be displayed as a decimal value rounded to two\ndecimal places.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe second line contains N space-separated integers representing production quantities.\n\nOutput Format\n\nPrint the total production on the first line.\n\nPrint the average production on the second line.\n\nPrint the difference between the maximum and minimum production on the third line.\n\nCode Constraints\n\n1 ≤ N ≤ 1000\n0 ≤ Production Quantity ≤ 100000", "input": "5\n\n420 510 380 600 490", "output": "2400\n\n480.00\n\n220", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        int[] a = new int[n];\n\n        long total = 0;\n        int min = Integer.MAX_VALUE, max = Integer.MIN_VALUE;\n\n        for (int i = 0; i < n; i++) {\n            a[i] = sc.nextInt();\n            total += a[i];\n            min = Math.min(min, a[i]);\n            max = Math.max(max, a[i]);\n        }\n\n        System.out.println(total);\n        System.out.printf(\"%.2f%n\", (double) total / n);\n        System.out.println(max - min);\n    }\n}", "sourceHasSql": false}, {"id": 3, "topic": "Core Java", "description": "A digital security system receives a positive integer identification number. For verification, it\nneeds to calculate the sum of its even digits and the sum of its odd digits separately.\n\nWrite a Java program to process the number digit by digit using arithmetic and modulus\noperations. Display the sum of even digits and the sum of odd digits.\n\nInput Format\nThe input consists of a single positive integer N.\n\nOutput Format\n\nPrint the sum of even digits on the first line.\n\nPrint the sum of odd digits on the second line.\n\nCode Constraints\n\n10 ≤ N ≤ 999999999", "input": "583241", "output": "6\n\n21", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        long n = sc.nextLong();\n\n        int evenSum = 0, oddSum = 0;\n\n        while (n > 0) {\n            int digit = (int)(n % 10);\n            if (digit % 2 == 0) evenSum += digit;\n            else oddSum += digit;\n            n /= 10;\n        }\n\n        System.out.println(evenSum);\n        System.out.println(oddSum);\n    }\n}", "sourceHasSql": false}, {"id": 4, "topic": "Core Java", "description": "A warehouse system stores package weights in an integer array. Due to a change in the\nmeasurement system, every package weight must be converted from kilograms to grams\nbefore generating the report.\n\nWrite a Java program to read the package weights and display their corresponding values in\ngrams. The calculation should use an appropriate data type because the converted value\nmay exceed the normal integer range for larger inputs.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe second line contains N space-separated integers representing package weights in\nkilograms.\n\nOutput Format\n\nPrint the converted weights in grams separated by a single space.\n\nCode Constraints\n\n1 ≤ N ≤ 1000\n1 ≤ Weight ≤ 1000000", "input": "4\n\n12 25 40 8", "output": "12000 25000 40000 8000", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        for (int i = 0; i < n; i++) {\n            long kg = sc.nextLong();\n            System.out.print(kg * 1000L);\n            if (i < n - 1) System.out.print(\" \");\n        }\n        System.out.println();\n    }\n}", "sourceHasSql": false}, {"id": 5, "topic": "Core Java", "description": "A shopping application stores information about a product using a Java class. Each product\nhas a product ID, product price, and available quantity.\n\nCreate a class named Product containing these attributes and a method named\ncalculateValue() that returns the total inventory value:\n\nTotal Value = Price × Quantity\n\nCreate a Product object using the input values and display the calculated inventory value.\n\nInput Format\n\nThe first line contains the product ID.\n\nThe second line contains the product price.\n\nThe third line contains the available quantity.\n\nOutput Format\n\nPrint the total inventory value rounded to two decimal places.\n\nCode Constraints\n\n1 ≤ Product ID ≤ 100000\n0 < Price ≤ 1000000\n0 ≤ Quantity ≤ 100000", "input": "105\n\n1250.50\n\n8", "output": "10004.00", "solution": "import java.util.*;\n\nclass Product {\n    int productId;\n    double price;\n    int quantity;\n\n    Product(int productId, double price, int quantity) {\n        this.productId = productId;\n        this.price = price;\n        this.quantity = quantity;\n    }\n\n    double calculateValue() {\n        return price * quantity;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n\n        int id = sc.nextInt();\n        double price = sc.nextDouble();\n        int quantity = sc.nextInt();\n\n        Product p = new Product(id, price, quantity);\n        System.out.printf(\"%.2f%n\", p.calculateValue());\n    }\n}", "sourceHasSql": false}, {"id": 6, "topic": "Arrays & Strings", "description": "A data processing system receives N integer values. The system needs to rearrange the array\nso that all even numbers appear first, followed by all odd numbers, while preserving their\noriginal order within each group.\n\nWrite a Java program to perform this rearrangement without using another array.\nInput Format\n\nThe first line contains an integer N.\n\nThe second line contains N space-separated integers.\n\nOutput Format\n\nPrint all even values followed by all odd values, separated by a single space.\n\nCode Constraints\n\n1 ≤ N ≤ 1000\n−10000 ≤ Value ≤ 10000", "input": "8\n\n7 4 9 2 6 11 8 5", "output": "4 2 6 8 7 9 11 5", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        int[] a = new int[n];\n\n        for (int i = 0; i < n; i++) a[i] = sc.nextInt();\n\n        // Stable in-place partition: insertion-style shifting.\n        int nextEven = 0;\n        for (int i = 0; i < n; i++) {\n            if (a[i] % 2 == 0) {\n                int value = a[i];\n                for (int j = i; j > nextEven; j--) {\n                    a[j] = a[j - 1];\n                }\n                a[nextEven++] = value;\n            }\n        }\n\n        for (int i = 0; i < n; i++) {\n            if (i > 0) System.out.print(\" \");\n            System.out.print(a[i]);\n        }\n        System.out.println();\n    }\n}", "sourceHasSql": false}, {"id": 7, "topic": "Arrays & Strings", "description": "A text-processing application receives a sentence and needs to determine whether the\nsentence is a palindrome after ignoring spaces and differences between uppercase and\nlowercase letters.\n\nFor example, \"Never Odd Or Even\" should be considered a palindrome.\n\nWrite a Java program to perform the required string processing and print Palindrome if the\nsentence satisfies the condition; otherwise print Not Palindrome.\n\nInput Format\n\nThe input consists of a single line containing a sentence.\n\nOutput Format\n\nPrint Palindrome or Not Palindrome.\n\nCode Constraints\n\n1 ≤ Length of sentence ≤ 200\nThe sentence may contain uppercase letters, lowercase letters, and spaces.", "input": "Never Odd Or Even", "output": "Palindrome", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        String s = sc.nextLine();\n\n        int left = 0, right = s.length() - 1;\n        boolean palindrome = true;\n\n        while (left < right) {\n            while (left < right && s.charAt(left) == ' ') left++;\n            while (left < right && s.charAt(right) == ' ') right--;\n\n            char a = Character.toLowerCase(s.charAt(left));\n            char b = Character.toLowerCase(s.charAt(right));\n\n            if (a != b) {\n                palindrome = false;\n                break;\n            }\n            left++;\n            right--;\n        }\n\n        System.out.println(palindrome ? \"Palindrome\" : \"Not Palindrome\");\n    }\n}", "sourceHasSql": false}, {"id": 8, "topic": "Arrays & Strings", "description": "An examination system receives the marks of N students. A method named\ncalculateGrade(int marks) must be created to determine the grade of each student according\nto the following rules:\n\n90–100 → A\n75–89 → B\n60–74 → C\n40–59 → D\nBelow 40 → F\n\nWrite a Java program that uses the method for every student's marks and displays the\ncorresponding grades in the same order.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe second line contains N space-separated marks.\n\nOutput Format\n\nPrint the grades separated by a single space.\n\nCode Constraints\n\n1 ≤ N ≤ 100\n0 ≤ Marks ≤ 100", "input": "6\n\n92 76 65 48 35 88", "output": "ABCDFB", "solution": "import java.util.*;\n\npublic class Main {\n    static char calculateGrade(int marks) {\n        if (marks >= 90) return 'A';\n        if (marks >= 75) return 'B';\n        if (marks >= 60) return 'C';\n        if (marks >= 40) return 'D';\n        return 'F';\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        StringBuilder out = new StringBuilder();\n        for (int i = 0; i < n; i++) {\n            out.append(calculateGrade(sc.nextInt()));\n        }\n        System.out.println(out);\n    }\n}", "sourceHasSql": false}, {"id": 9, "topic": "Collections", "description": "A hospital maintains the token numbers of patients waiting for registration using an\nArrayList. During registration, some token numbers are cancelled.\nWrite a Java program to store the token numbers in an ArrayList, remove all token numbers\nthat are divisible by a given cancellation number, and display the remaining token numbers\nin their original order.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe second line contains N space-separated token numbers.\n\nThe third line contains the cancellation number.\n\nOutput Format\n\nPrint the remaining token numbers separated by a single space.\n\nIf no token remains, print -1.\n\nCode Constraints\n\n1 ≤ N ≤ 1000\n1 ≤ Token Number ≤ 100000\n1 ≤ Cancellation Number ≤ 100", "input": "8\n\n12 15 18 21 24 25 30 31\n\n3", "output": "15 25 31", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        ArrayList<Integer> tokens = new ArrayList<>();\n\n        for (int i = 0; i < n; i++) tokens.add(sc.nextInt());\n\n        int cancel = sc.nextInt();\n        tokens.removeIf(x -> x % cancel == 0);\n\n        if (tokens.isEmpty()) {\n            System.out.println(\"-1\");\n            return;\n        }\n\n        for (int i = 0; i < tokens.size(); i++) {\n            if (i > 0) System.out.print(\" \");\n            System.out.print(tokens.get(i));\n        }\n        System.out.println();\n    }\n}", "sourceHasSql": false}, {"id": 10, "topic": "Collections", "description": "A logistics system maintains container IDs using a Vector. A new container is inserted after a\nspecified existing container ID.\n\nWrite a Java program to search for the specified container ID in the Vector. If the ID is found,\ninsert the new container ID immediately after it. If the ID is not found, print Container Not\nFound.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe second line contains N space-separated container IDs.\n\nThe third line contains the existing container ID.\nThe fourth line contains the new container ID.\n\nOutput Format\n\nPrint the updated Vector if the existing ID is found.\n\nOtherwise, print Container Not Found.\n\nCode Constraints\n\n1 ≤ N ≤ 1000\n1 ≤ Container ID ≤ 1000000", "input": "5\n\n201 305 410 512 620\n\n410\n\n999", "output": "201 305 410 999 512 620", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        Vector<Integer> v = new Vector<>();\n\n        for (int i = 0; i < n; i++) v.add(sc.nextInt());\n\n        int existing = sc.nextInt();\n        int newId = sc.nextInt();\n\n        int index = v.indexOf(existing);\n        if (index == -1) {\n            System.out.println(\"Container Not Found\");\n            return;\n        }\n\n        v.add(index + 1, newId);\n\n        for (int i = 0; i < v.size(); i++) {\n            if (i > 0) System.out.print(\" \");\n            System.out.print(v.get(i));\n        }\n        System.out.println();\n    }\n}", "sourceHasSql": false}, {"id": 11, "topic": "Collections", "description": "A task management application maintains pending task IDs using a LinkedList. The system\nreceives a task ID that has been completed and must remove its first occurrence from the\nlist.\n\nWrite a Java program to search for the given task ID and remove its first occurrence. If the\ntask ID does not exist, print Task Not Found.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe second line contains N space-separated task IDs.\n\nThe third line contains the task ID to be removed.\n\nOutput Format\n\nPrint the updated list if the task exists.\n\nOtherwise, print Task Not Found.\n\nCode Constraints\n1 ≤ N ≤ 1000\n1 ≤ Task ID ≤ 1000000", "input": "7\n\n101 205 310 205 415 520 610\n\n205", "output": "101 310 205 415 520 610", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        LinkedList<Integer> list = new LinkedList<>();\n\n        for (int i = 0; i < n; i++) list.add(sc.nextInt());\n\n        int target = sc.nextInt();\n        if (!list.removeFirstOccurrence(target)) {\n            System.out.println(\"Task Not Found\");\n            return;\n        }\n\n        for (int i = 0; i < list.size(); i++) {\n            if (i > 0) System.out.print(\" \");\n            System.out.print(list.get(i));\n        }\n        System.out.println();\n    }\n}", "sourceHasSql": false}, {"id": 12, "topic": "Collections", "description": "A university receives registration records from different departments. The same student may\nregister more than once due to repeated attempts.\n\nUsing a HashSet, determine whether the number of unique student IDs is greater than half\nof the total number of registration records.\n\nPrint High Unique Registration if the condition is satisfied; otherwise print Low Unique\nRegistration.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe second line contains N student IDs.\n\nOutput Format\n\nPrint the appropriate message.\n\nCode Constraints\n\n1 ≤ N ≤ 1000\n1 ≤ Student ID ≤ 1000000", "input": "8\n\n101 102 103 101 104 105 106 102", "output": "High Unique Registration", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        HashSet<Integer> unique = new HashSet<>();\n\n        for (int i = 0; i < n; i++) unique.add(sc.nextInt());\n\n        if (unique.size() > n / 2.0)\n            System.out.println(\"High Unique Registration\");\n        else\n            System.out.println(\"Low Unique Registration\");\n    }\n}", "sourceHasSql": false}, {"id": 13, "topic": "Collections", "description": "A company maintains employee performance scores. The scores must be stored in a TreeSet\nso that duplicate scores are automatically removed and the remaining scores are maintained\nin sorted order.\n\nThe management wants to find the highest score that is strictly less than a given target\nscore.\n\nWrite a Java program using TreeSet to perform this operation. If no such score exists, print -\n1.\n\nInput Format\n\nThe first line contains an integer N.\n\nThe second line contains N space-separated scores.\n\nThe third line contains the target score.\n\nOutput Format\n\nPrint the greatest score smaller than the target score.\n\nCode Constraints\n\n1 ≤ N ≤ 1000\n0 ≤ Score ≤ 100\n0 ≤ Target Score ≤ 100", "input": "8\n\n45 72 88 65 72 91 54 80\n\n75", "output": "72", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        TreeSet<Integer> scores = new TreeSet<>();\n\n        for (int i = 0; i < n; i++) scores.add(sc.nextInt());\n\n        int target = sc.nextInt();\n        Integer result = scores.lower(target);\n\n        System.out.println(result == null ? -1 : result);\n    }\n}", "sourceHasSql": false}, {"id": 14, "topic": "Collections", "description": "An inventory system maintains product IDs and their quantities using a HashMap. A manager\nwants to calculate the total quantity available for a particular product category represented\nby a set of product IDs.\n\nWrite a Java program to store product ID and quantity pairs in a HashMap. Given M product\nIDs, calculate the total quantity of those products. If a product ID is not present in the map,\nits quantity should not be included.\n\nInput Format\nThe first line contains N.\n\nThe next N lines contain product ID and quantity.\n\nThe next line contains M.\n\nThe following line contains M product IDs.\n\nOutput Format\n\nPrint the total quantity of the specified products.\n\nCode Constraints\n\n1 ≤ N ≤ 1000\n1 ≤ M ≤ 100\n1 ≤ Product ID ≤ 100000\n0 ≤ Quantity ≤ 10000", "input": "5\n\n101 20\n\n102 35\n\n103 15\n\n104 50\n\n105 25\n\n4\n\n101 103 105 110", "output": "60", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        HashMap<Integer, Integer> map = new HashMap<>();\n\n        for (int i = 0; i < n; i++) {\n            int id = sc.nextInt();\n            int qty = sc.nextInt();\n            map.put(id, qty);\n        }\n\n        int m = sc.nextInt();\n        long total = 0;\n\n        for (int i = 0; i < m; i++) {\n            int id = sc.nextInt();\n            total += map.getOrDefault(id, 0);\n        }\n\n        System.out.println(total);\n    }\n}", "sourceHasSql": false}, {"id": 15, "topic": "Collections", "description": "A service center assigns a priority number to each service request. A smaller number\nrepresents a higher priority. However, requests having the same priority must also be\nprocessed.\n\nUsing a PriorityQueue, process all requests and calculate the sum of the first K priorities that\nare processed.\n\nInput Format\n\nThe first line contains N.\nThe second line contains N priority numbers.\n\nThe third line contains K.\n\nOutput Format\n\nPrint the sum of the first K priorities removed from the PriorityQueue.\n\nCode Constraints\n\n1 ≤ K ≤ N ≤ 1000\n1 ≤ Priority ≤ 100000", "input": "7\n\n18 5 12 30 9 25 3\n\n3", "output": "17", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        PriorityQueue<Integer> pq = new PriorityQueue<>();\n\n        for (int i = 0; i < n; i++) pq.offer(sc.nextInt());\n\n        int k = sc.nextInt();\n        long sum = 0;\n\n        while (k-- > 0) sum += pq.poll();\n\n        System.out.println(sum);\n    }\n}", "sourceHasSql": false}, {"id": 16, "topic": "Generics", "description": "A software application needs a reusable container capable of storing values of different data\ntypes. Create a generic class named Box<T> that stores a value and provides a method\ngetValue() to retrieve it.\n\nThe program receives an integer and a decimal value. Create appropriate generic objects\nand display both values.\n\nInput Format\n\nThe first line contains an integer.\n\nThe second line contains a decimal value.\n\nOutput Format\n\nPrint the integer on the first line and the decimal value rounded to two decimal places on\nthe second line.", "input": "250\n\n45.75", "output": "250\n\n45.75", "solution": "import java.util.*;\n\nclass Box<T> {\n    private T value;\n\n    Box(T value) {\n        this.value = value;\n    }\n\n    T getValue() {\n        return value;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n\n        Box<Integer> integerBox = new Box<>(sc.nextInt());\n        Box<Double> decimalBox = new Box<>(sc.nextDouble());\n\n        System.out.println(integerBox.getValue());\n        System.out.printf(\"%.2f%n\", decimalBox.getValue());\n    }\n}", "sourceHasSql": false}, {"id": 17, "topic": "Exceptions", "description": "A banking application accepts a withdrawal amount from a customer's account. A\nwithdrawal is valid only when the amount is positive and does not exceed the available\nbalance.\n\nWrite a Java program using try-catch-finally to perform the withdrawal. Handle invalid\nwithdrawal amounts and insufficient balance without terminating the program\nunexpectedly.\n\nIf the withdrawal is valid, print the remaining balance.\n\nIf the amount is invalid, print Invalid Amount.\n\nIf the amount exceeds the balance, print Insufficient Balance.\n\nInput Format\n\nThe first line contains the account balance.\n\nThe second line contains the withdrawal amount.\n\nOutput Format\n\nPrint the remaining balance or the appropriate error message.\n\nCode Constraints\n\n0 ≤ Balance ≤ 1000000\n−1000 ≤ Withdrawal Amount ≤ 1000000", "input": "25000\n\n7500", "output": "17500", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        double balance = sc.nextDouble();\n        double withdrawal = sc.nextDouble();\n\n        try {\n            if (withdrawal <= 0)\n                throw new IllegalArgumentException();\n\n            if (withdrawal > balance)\n                throw new ArithmeticException();\n\n            balance -= withdrawal;\n            System.out.printf(\"%.0f%n\", balance);\n        } catch (IllegalArgumentException e) {\n            System.out.println(\"Invalid Amount\");\n        } catch (ArithmeticException e) {\n            System.out.println(\"Insufficient Balance\");\n        } finally {\n            // Required finally block; no output is produced.\n        }\n    }\n}", "sourceHasSql": false}, {"id": 18, "topic": "Exceptions", "description": "An online examination system accepts a student's score only when it is between 0 and 100.\nCreate a custom exception named InvalidScoreException.\n\nCreate a method validateScore(int score) that throws the custom exception when the score\nis outside the valid range.\nWrite a Java program to validate the entered score and handle the exception.\n\nInput Format\n\nThe input consists of a single integer representing the score.\n\nOutput Format\n\nPrint the score if it is valid.\n\nOtherwise print:\n\nInvalid Score\n\nCode Constraints\n\n−100 ≤ Score ≤ 150", "input": "85", "output": "85", "solution": "import java.util.*;\n\nclass InvalidScoreException extends Exception {\n    InvalidScoreException(String message) {\n        super(message);\n    }\n}\n\npublic class Main {\n    static void validateScore(int score) throws InvalidScoreException {\n        if (score < 0 || score > 100)\n            throw new InvalidScoreException(\"Invalid Score\");\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int score = sc.nextInt();\n\n        try {\n            validateScore(score);\n            System.out.println(score);\n        } catch (InvalidScoreException e) {\n            System.out.println(\"Invalid Score\");\n        }\n    }\n}", "sourceHasSql": false}, {"id": 19, "topic": "Streams", "description": "An examination portal stores marks obtained by students. The faculty wants to identify the\nmarks that are above the class average.\n\nUsing the Stream API, calculate the average marks and then display only the marks strictly\ngreater than the average, preserving their original order.\n\nIf no mark is greater than the average, print -1.\n\nInput Format\n\nThe first line contains N.\n\nThe second line contains N space-separated marks.\n\nOutput Format\n\nPrint the qualifying marks separated by a single space.\n\nCode Constraints\n\n1 ≤ N ≤ 100\n0 ≤ Marks ≤ 100", "input": "6\n40 55 70 80 65 50", "output": "70 80 65", "solution": "import java.util.*;\nimport java.util.stream.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        List<Integer> marks = new ArrayList<>();\n\n        for (int i = 0; i < n; i++) marks.add(sc.nextInt());\n\n        double avg = marks.stream()\n                .mapToInt(Integer::intValue)\n                .average()\n                .orElse(0);\n\n        String result = marks.stream()\n                .filter(x -> x > avg)\n                .map(String::valueOf)\n                .collect(Collectors.joining(\" \"));\n\n        System.out.println(result.isEmpty() ? \"-1\" : result);\n    }\n}", "sourceHasSql": false}, {"id": 20, "topic": "Streams", "description": "A delivery company records the distances travelled by its vehicles. Some distances may be\nrepeated because multiple vehicles travel the same distance.\n\nUsing the Stream API, remove duplicate distances, sort the remaining distances in\ndescending order, and display the top three distinct distances. If fewer than three distinct\ndistances exist, display all available distinct distances.\n\nInput Format\n\nThe first line contains N.\n\nThe second line contains N space-separated distances.\n\nOutput Format\n\nPrint the top three distinct distances in descending order.\n\nCode Constraints\n\n1 ≤ N ≤ 1000\n1 ≤ Distance ≤ 100000", "input": "8\n\n120 450 300 450 700 120 550 700", "output": "700 550 450", "solution": "import java.util.*;\nimport java.util.stream.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        List<Integer> distances = new ArrayList<>();\n        for (int i = 0; i < n; i++) distances.add(sc.nextInt());\n\n        String result = distances.stream()\n                .distinct()\n                .sorted(Comparator.reverseOrder())\n                .limit(3)\n                .map(String::valueOf)\n                .collect(Collectors.joining(\" \"));\n\n        System.out.println(result);\n    }\n}", "sourceHasSql": false}, {"id": 21, "topic": "Streams", "description": "A company's payroll system stores the salaries of its employees. The management wants to\ncalculate the total salary of employees whose salary is greater than a specified threshold.\n\nUsing the Stream API, filter the qualifying salaries and use a reduction operation to calculate\ntheir total.\n\nInput Format\n\nThe first line contains N.\n\nThe second line contains N salary values.\nThe third line contains the salary threshold.\n\nOutput Format\n\nPrint the total salary of all employees whose salary is strictly greater than the threshold.\n\nCode Constraints\n\n1 ≤ N ≤ 1000\n10000 ≤ Salary ≤ 1000000\n10000 ≤ Threshold ≤ 1000000", "input": "6\n\n35000 52000 48000 75000 42000 90000\n\n50000", "output": "217000", "solution": "import java.util.*;\nimport java.util.stream.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        List<Long> salaries = new ArrayList<>();\n\n        for (int i = 0; i < n; i++) salaries.add(sc.nextLong());\n\n        long threshold = sc.nextLong();\n\n        long total = salaries.stream()\n                .filter(s -> s > threshold)\n                .reduce(0L, Long::sum);\n\n        System.out.println(total);\n    }\n}", "sourceHasSql": false}, {"id": 22, "topic": "Streams", "description": "An online store maintains product prices. The store wants to apply a category-based\ntransformation to its prices using the Stream API.\n\nFor every price:\n\n    •   If the price is at least 1000, apply a 15% discount.\n\n    •   Otherwise, apply a 5% discount.\n\nUse Stream API mapping operations to generate the final prices and display them rounded\nto the nearest integer.\n\nInput Format\n\nThe first line contains N.\n\nThe second line contains N integer prices.\n\nOutput Format\n\nPrint the updated prices separated by a single space.\n\nCode Constraints\n\n1 ≤ N ≤ 100\n100 ≤ Price ≤ 100000", "input": "6\n\n500 1200 800 2000 1500 900", "output": "475 1020 760 1700 1275 855", "solution": "import java.util.*;\nimport java.util.stream.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        List<Integer> prices = new ArrayList<>();\n        for (int i = 0; i < n; i++) prices.add(sc.nextInt());\n\n        String result = prices.stream()\n                .map(p -> p >= 1000 ? Math.round(p * 0.85) : Math.round(p * 0.95))\n                .map(String::valueOf)\n                .collect(Collectors.joining(\" \"));\n\n        System.out.println(result);\n    }\n}", "sourceHasSql": false}, {"id": 23, "topic": "Streams", "description": "A university maintains student marks and wants to prepare a summary using the Stream API.\nEach mark must be classified into one of three categories:\n\n    •    High → marks ≥ 75\n\n    •    Medium → marks between 50 and 74\n\n    •    Low → marks below 50\n\nUse Collectors.groupingBy() to group the marks according to these categories and display\nthe number of students in each category.\n\nInput Format\n\nThe first line contains N.\n\nThe second line contains N space-separated marks.\n\nOutput Format\n\nPrint:\n\nHigh: count\n\nMedium: count\n\nLow: count\n\non separate lines.\n\nCode Constraints\n\n1 ≤ N ≤ 1000\n0 ≤ Marks ≤ 100", "input": "8\n\n82 45 67 91 38 75 54 49", "output": "High: 3\n\nMedium: 2\n\nLow: 3", "solution": "import java.util.*;\nimport java.util.stream.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        Map<String, Long> counts = IntStream.range(0, n)\n                .mapToObj(i -> sc.nextInt())\n                .collect(Collectors.groupingBy(\n                        m -> m >= 75 ? \"High\" : m >= 50 ? \"Medium\" : \"Low\",\n                        Collectors.counting()\n                ));\n\n        System.out.println(\"High: \" + counts.getOrDefault(\"High\", 0L));\n        System.out.println(\"Medium: \" + counts.getOrDefault(\"Medium\", 0L));\n        System.out.println(\"Low: \" + counts.getOrDefault(\"Low\", 0L));\n    }\n}", "sourceHasSql": false}, {"id": 24, "topic": "Streams", "description": "A data analytics system receives N integer values. The system needs to calculate the sum of\nthe squares of only the even values.\n\nUsing the Stream API, filter the even numbers, transform each value into its square, and use\na reduction operation to calculate the final sum.\n\nInput Format\n\nThe first line contains N.\n\nThe second line contains N integers.\n\nOutput Format\n\nPrint the sum of squares of all even values.\n\nCode Constraints\n\n1 ≤ N ≤ 100\n−1000 ≤ Value ≤ 1000", "input": "6\n\n346587", "output": "116", "solution": "import java.util.*;\nimport java.util.stream.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        List<Integer> values = new ArrayList<>();\n        for (int i = 0; i < n; i++) values.add(sc.nextInt());\n\n        long sum = values.stream()\n                .filter(x -> x % 2 == 0)\n                .map(x -> (long) x * x)\n                .reduce(0L, Long::sum);\n\n        System.out.println(sum);\n    }\n}", "sourceHasSql": false}, {"id": 25, "topic": "Exceptions", "description": "A data processing system receives two integers and uses the first integer as an array index\nand the second integer as a divisor.\n\nWrite a Java program using exception handling to manage both an invalid array index and\ndivision by zero. Use appropriate exception classes from Java's exception hierarchy and\nhandle each situation separately.\n\nIf the index is invalid, print:\n\nInvalid Index\n\nIf the divisor is zero, print:\nDivision By Zero\n\nOtherwise, print the value at the specified index divided by the divisor.\n\nInput Format\n\nThe first line contains N.\n\nThe second line contains N integers.\n\nThe third line contains the index.\n\nThe fourth line contains the divisor.\n\nOutput Format\n\nPrint the calculated result or the appropriate exception message.\n\nCode Constraints\n\n1 ≤ N ≤ 100\n−1000 ≤ Array Element ≤ 1000\n−100 ≤ Index ≤ 100\n−100 ≤ Divisor ≤ 100", "input": "5\n\n20 40 60 80 100\n\n2\n\n10", "output": "6", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        int[] a = new int[n];\n\n        for (int i = 0; i < n; i++) a[i] = sc.nextInt();\n\n        int index = sc.nextInt();\n        int divisor = sc.nextInt();\n\n        try {\n            int value = a[index];\n            try {\n                System.out.println(value / divisor);\n            } catch (ArithmeticException e) {\n                System.out.println(\"Division By Zero\");\n            }\n        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"Invalid Index\");\n        }\n    }\n}", "sourceHasSql": false}, {"id": 26, "topic": "Arrays & Data Modeling", "description": "A library management system stores information about the books borrowed by each\nmember. Currently, all borrowed book names are stored together in a single field, separated\nby commas.\n\nFor example:\n\n201 Java,Python,DBMS\nThis creates multiple values in one field and therefore violates the requirements of First\nNormal Form (1NF).\n\nTo normalize the data, develop a Java program that converts each member's record into 1NF\nformat, where each record contains exactly one member and one borrowed book.\n\nThe program should:\n\n•      Separate the comma-separated book list into individual book names.\n\n•      Generate a separate record for every book borrowed by a member.\n\n•      Preserve the original order of members.\n\n•      Preserve the original order of books for each member.\n\nThe resulting records should have the structure:\n\nMemberID Book\n\nInput Format\n\n•      The first line contains an integer N, representing the number of member records.\n\n•      Each of the next N lines contains:\n\no      Member ID\n\no      Comma-separated list of borrowed books.\n\nConstraints\n\n•      1 ≤ N ≤ 50\n\n•      1 ≤ number of books per member ≤ 5\n\n•      Member ID is a positive integer.\n\n•      Book names contain only alphabets.\n\n•      There are no spaces around commas.\n\nOutput Format\n\nPrint each book as an individual record in the following format:\n\nMemberID Book\n\nMaintain the same order as provided in the input.", "input": "3\n\n201 Java,Python,DBMS\n202 HTML,CSS\n\n203 JavaScript,React", "output": "201 Java\n\n201 Python\n\n201 DBMS\n\n202 HTML\n\n202 CSS\n\n203 JavaScript\n\n203 React", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        for (int i = 0; i < n; i++) {\n            int memberId = sc.nextInt();\n            String[] books = sc.next().split(\",\");\n\n            for (String book : books)\n                System.out.println(memberId + \" \" + book);\n        }\n    }\n}", "sourceHasSql": false}, {"id": 27, "topic": "Arrays & Data Modeling", "description": "A hospital management system maintains patient treatment information in a single table\ncontaining both patient details and treatment-specific information:\n\nPatientID PatientName TreatmentID TreatmentName DoctorName\n\nSince a patient may receive multiple treatments, the patient's ID and name are repeated for\nevery treatment record. This causes unnecessary duplication of patient information.\n\nTo restructure the data according to the principles of Second Normal Form (2NF), the\nhospital wants to create a patient-level summary in which each patient appears only once.\n\nDevelop a Java program using arrays and loops to process the given treatment records and:\n\nIdentify each unique patient using the Patient ID.\n\nStore the patient's name only once in the summary.\n\nCount the total number of different treatment records associated with each patient.\n\nPreserve the order in which patients first appear in the input.\n\nDisplay the patient ID, patient name, and total treatment count.\n\nInput Format\nThe first line contains an integer N, representing the number of treatment records.\n\nEach of the next N lines contains:\n\nPatient ID\n\nPatient Name\n\nTreatment ID\n\nTreatment Name\n\nDoctor Name\n\nConstraints\n\n1 ≤ N ≤ 50\n\nPatient ID and Treatment ID are positive integers.\n\nPatient and doctor names contain no spaces.\n\nThe same patient-treatment combination does not occur more than once.\n\nOutput Format\n\nFor each unique patient, print:\n\nPatientID PatientName TreatmentCount\n\nMaintain the order of the patient's first appearance in the input.", "input": "6\n\n501 Rahul 301 Checkup DrKumar\n\n502 Neha 302 XRay DrSharma\n\n501 Rahul 303 BloodTest DrMehta\n\n503 Aman 301 Checkup DrKumar\n\n502 Neha 304 MRI DrSingh\n\n501 Rahul 305 ECG DrPatel", "output": "501 Rahul 3\n\n502 Neha 2\n\n503 Aman 1", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        int[] ids = new int[n];\n        String[] names = new String[n];\n        int[] counts = new int[n];\n        int unique = 0;\n\n        for (int i = 0; i < n; i++) {\n            int id = sc.nextInt();\n            String name = sc.next();\n            sc.nextInt(); // treatment ID\n            sc.next();    // treatment name\n            sc.next();    // doctor name\n\n            int pos = -1;\n            for (int j = 0; j < unique; j++) {\n                if (ids[j] == id) {\n                    pos = j;\n                    break;\n                }\n            }\n\n            if (pos == -1) {\n                ids[unique] = id;\n                names[unique] = name;\n                counts[unique] = 1;\n                unique++;\n            } else {\n                counts[pos]++;\n            }\n        }\n\n        for (int i = 0; i < unique; i++)\n            System.out.println(ids[i] + \" \" + names[i] + \" \" + counts[i]);\n    }\n}", "sourceHasSql": false}, {"id": 28, "topic": "Arrays & Data Modeling", "description": "A college administration system maintains student enrollment records containing student\nand department information in the following structure:\n\nStudentID StudentName DepartmentID DepartmentName\n\nDuring database analysis, it is observed that the DepartmentName is determined by the\nDepartmentID, rather than directly by the StudentID. Therefore, the dependencies can be\nrepresented as:\n\nStudentID → StudentName, DepartmentID\n\nDepartmentID → DepartmentName\n\nThis creates a transitive dependency, which is addressed by Third Normal Form (3NF).\n\nFor this programming task, the college wants to generate a simplified student summary in\nwhich duplicate student records are removed.\n\nDevelop a Java program using arrays and loops only to:\n\nIdentify whether a student has already been processed using the StudentID.\n\nStore each unique student only once.\n\nAssociate the student with the corresponding department name.\n\nPreserve the order in which unique students first appear in the input.\n\nIgnore duplicate records for an already processed student.\n\nInput Format\nThe first line contains an integer N, representing the number of enrollment records.\n\nEach of the next N lines contains:\n\nStudent ID\n\nStudent Name\n\nDepartment ID\n\nDepartment Name\n\nConstraints\n\n1 ≤ N ≤ 50\n\nStudent IDs and Department IDs are positive integers.\n\nStudent names and department names contain no spaces.\n\nThe same student may occur more than once.\n\nRepeated records for the same student contain the same department information.\n\nOutput Format\n\nFor every unique student, print:\n\nStudentID StudentName DepartmentName\n\nMaintain the order in which the students first appear in the input.", "input": "6\n\n201 Arjun 10 ComputerScience\n\n202 Priya 20 Commerce\n\n203 Karan 10 ComputerScience\n\n201 Arjun 10 ComputerScience\n\n204 Sneha 30 Mathematics\n\n202 Priya 20 Commerce", "output": "201 Arjun ComputerScience\n\n202 Priya Commerce\n\n203 Karan ComputerScience\n\n204 Sneha Mathematics", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        int[] ids = new int[n];\n        String[] names = new String[n];\n        String[] departments = new String[n];\n        int unique = 0;\n\n        for (int i = 0; i < n; i++) {\n            int id = sc.nextInt();\n            String name = sc.next();\n            sc.nextInt(); // department ID\n            String dept = sc.next();\n\n            boolean seen = false;\n            for (int j = 0; j < unique; j++) {\n                if (ids[j] == id) {\n                    seen = true;\n                    break;\n                }\n            }\n\n            if (!seen) {\n                ids[unique] = id;\n                names[unique] = name;\n                departments[unique] = dept;\n                unique++;\n            }\n        }\n\n        for (int i = 0; i < unique; i++)\n            System.out.println(ids[i] + \" \" + names[i] + \" \" + departments[i]);\n    }\n}", "sourceHasSql": false}, {"id": 29, "topic": "Arrays & Data Modeling", "description": "A university classroom management system stores course allocation information in the\nfollowing structure:\n\nCourseID FacultyID FacultyName RoomNo\n\nA faculty member can teach multiple courses, and a room can be used for multiple courses.\nThe university has the following functional dependencies:\n\nCourseID → FacultyID\n\nFacultyID → FacultyName\n\nRoomNo → FacultyID\n\nThe system wants to create a simplified faculty allocation summary by keeping only the first\noccurrence of each FacultyID.\n\nDevelop a pure Java program using arrays and loops only to:\n\nRead the given allocation records.\n\nIdentify whether a faculty member has already been processed using FacultyID.\n\nStore each unique faculty member only once.\n\nStore the corresponding FacultyName and RoomNo.\n\nIgnore duplicate records for the same faculty.\n\nPreserve the order in which faculty members first appear.\n\nDisplay the unique faculty allocation records.\n\nInput Format\n\nThe first line contains an integer N, representing the number of records.\n\nEach of the next N lines contains:\nCourseID FacultyID FacultyName RoomNo\n\nConstraints\n\n1 ≤ N ≤ 50\n\nCourse ID, Faculty ID, and Room Number are positive integers.\n\nFaculty names contain no spaces.\n\nThe same faculty may occur in multiple records.\n\nDuplicate faculty records contain the same faculty name.\n\nOutput Format\n\nFor every unique faculty member, print:\n\nFacultyID FacultyName RoomNo\n\nMaintain the order of first appearance.", "input": "7\n\n101 501 Sharma 201\n\n102 502 Mehta 202\n\n103 501 Sharma 201\n\n104 503 Gupta 203\n\n105 502 Mehta 202\n\n106 504 Singh 204\n\n107 501 Sharma 201", "output": "501 Sharma 201\n\n502 Mehta 202\n503 Gupta 203\n\n504 Singh 204", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        int[] facultyIds = new int[n];\n        String[] names = new String[n];\n        int[] rooms = new int[n];\n        int unique = 0;\n\n        for (int i = 0; i < n; i++) {\n            sc.nextInt(); // course ID\n            int facultyId = sc.nextInt();\n            String name = sc.next();\n            int room = sc.nextInt();\n\n            boolean seen = false;\n            for (int j = 0; j < unique; j++) {\n                if (facultyIds[j] == facultyId) {\n                    seen = true;\n                    break;\n                }\n            }\n\n            if (!seen) {\n                facultyIds[unique] = facultyId;\n                names[unique] = name;\n                rooms[unique] = room;\n                unique++;\n            }\n        }\n\n        for (int i = 0; i < unique; i++)\n            System.out.println(facultyIds[i] + \" \" + names[i] + \" \" + rooms[i]);\n    }\n}", "sourceHasSql": false}, {"id": 30, "topic": "Date-Time API", "description": "A hotel reservation system records the date on which a guest checks in and the number of\nnights included in the reservation. The system also records how many nights the guest has\nalready stayed.\n\nDevelop a Java program using the Java Date-Time API to process the reservation details and\ndetermine the reservation status.\n\nThe program must:\n\nCalculate the checkout date by adding the complete reservation period to the check-in date.\n\nDetermine the number of nights remaining by subtracting the nights already stayed from the\ntotal number of reserved nights.\n\nExtract and display the year and month from the calculated checkout date.\n\nUse the LocalDate class for all date calculations.\n\nInput Format\n\nThe input consists of three lines:\n\nThe first line contains the check-in date in the format yyyy-MM-dd.\n\nThe second line contains the total number of nights reserved.\n\nThe third line contains the number of nights already stayed.\n\nOutput Format\n\nPrint the following information on separate lines in the specified order:\n\nCheckout date\n\nRemaining nights\n\nYear of the checkout date\n\nMonth of the checkout date\n\nCode Constraints\n\nThe check-in date is valid.\n1 ≤ totalNights ≤ 365\n\n0 ≤ stayedNights < totalNights\n\nYear is between 2020 and 2030.", "input": "2026-08-10\n\n30\n\n12", "output": "2026-09-09\n\n18\n\n2026\n\n9", "solution": "import java.time.*;\nimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n\n        LocalDate checkIn = LocalDate.parse(sc.nextLine());\n        int totalNights = Integer.parseInt(sc.nextLine().trim());\n        int stayed = Integer.parseInt(sc.nextLine().trim());\n\n        LocalDate checkout = checkIn.plusDays(totalNights);\n\n        System.out.println(checkout);\n        System.out.println(totalNights - stayed);\n        System.out.println(checkout.getYear());\n        System.out.println(checkout.getMonthValue());\n    }\n}", "sourceHasSql": false}, {"id": 31, "topic": "Date-Time API", "description": "A college examination system records the date and starting time of an examination. The\nexamination lasts for a specified number of minutes.\n\nDevelop a Java program using the Java Date-Time API to determine the examination's ending\ndate and time.\n\nThe program must:\n\nRead the examination date using LocalDate.\n\nRead the examination start time using LocalTime.\n\nCombine the date and time using LocalDateTime.\n\nAdd the given examination duration in minutes.\n\nDisplay the resulting ending date and time.\n\nDisplay the year, month, and hour of the examination end time.\n\nUse LocalDate, LocalTime, and LocalDateTime for the required operations.\n\nInput Format\n\nThe input consists of three lines:\nThe first line contains the examination date in the format yyyy-MM-dd.\n\nThe second line contains the examination start time in the format HH:mm.\n\nThe third line contains the examination duration in minutes.\n\nConstraints\n\nThe examination date is valid.\n\nTime is provided in 24-hour format.\n\n30 ≤ duration ≤ 300.\n\nYear is between 2020 and 2030.\n\nOutput Format\n\nPrint the following on separate lines:\n\nExamination end date\n\nExamination end time\n\nYear of the end date\n\nMonth of the end date\n\nHour of the end time", "input": "2026-09-14\n\n22:30\n\n120", "output": "2026-09-15\n\n00:30\n\n2026\n\n9\n\n0", "solution": "import java.time.*;\nimport java.time.format.*;\nimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n\n        LocalDate date = LocalDate.parse(sc.nextLine());\n        LocalTime time = LocalTime.parse(sc.nextLine());\n        int duration = Integer.parseInt(sc.nextLine().trim());\n\n        LocalDateTime end = LocalDateTime.of(date, time).plusMinutes(duration);\n\n        System.out.println(end.toLocalDate());\n        System.out.println(end.toLocalTime().format(DateTimeFormatter.ofPattern(\"HH:mm\")));\n        System.out.println(end.getYear());\n        System.out.println(end.getMonthValue());\n        System.out.println(end.getHour());\n    }\n}", "sourceHasSql": false}, {"id": 32, "topic": "Functional Java", "description": "A smart electricity monitoring system receives the power consumption of several devices.\nThe system needs to process the readings using a functional programming approach.\n\nFor every reading, calculate the adjusted consumption using:\n\nAdjusted Consumption = Reading × 1.10\n\nWrite a Java program that stores the readings in a list and uses a functional approach to\nprocess each reading and display the adjusted consumption rounded to two decimal places.\n\nInput Format\n\nThe first line contains the number of devices.\n\nThe second line contains the power consumption readings separated by spaces.\n\nOutput Format\n\nPrint the adjusted consumption of each device separated by a space, with each value\ndisplayed up to two decimal places.\n\nCode Constraints\n\n1 ≤ N ≤ 100\n0 ≤ Reading ≤ 10000", "input": "4\n100 200 300 400", "output": "110.00 220.00 330.00 440.00", "solution": "import java.util.*;\nimport java.util.function.Consumer;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        List<Double> readings = new ArrayList<>();\n\n        for (int i = 0; i < n; i++) readings.add(sc.nextDouble());\n\n        Consumer<Double> adjust = x -> System.out.printf(\"%.2f \", x * 1.10);\n\n        for (double reading : readings) adjust.accept(reading);\n        System.out.println();\n    }\n}", "sourceHasSql": false}, {"id": 33, "topic": "Functional Java", "description": "A delivery company assigns a priority score to packages based on their weight. A package\nreceives a priority score equal to its weight multiplied by 2 and increased by 10.\n\nWrite a Java program using a Lambda Expression to calculate the priority score of every\npackage.\n\nInput Format\n\nThe first line contains the number of packages.\n\nThe second line contains the package weights separated by spaces.\n\nOutput Format\n\nPrint the priority score of each package separated by spaces.\nCode Constraints\n\n1 ≤ N ≤ 100\n1 ≤ Weight ≤ 1000", "input": "3\n10 25 40", "output": "30 60 90", "solution": "import java.util.*;\nimport java.util.function.Function;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        Function<Integer, Integer> priority = w -> w * 2 + 10;\n\n        for (int i = 0; i < n; i++) {\n            if (i > 0) System.out.print(\" \");\n            System.out.print(priority.apply(sc.nextInt()));\n        }\n        System.out.println();\n    }\n}", "sourceHasSql": false}, {"id": 34, "topic": "Functional Java", "description": "A quality-control system checks the temperature of machines. A machine is considered safe\nwhen its temperature is between 20 and 80 degrees Celsius, inclusive.\n\nCreate a Java program using a functional interface to determine whether each machine\ntemperature is safe or unsafe.\n\nInput Format\n\nThe first line contains the number of machines.\n\nThe second line contains the temperatures separated by spaces.\n\nOutput Format\n\nPrint Safe or Unsafe for each temperature, separated by spaces.\n\nCode Constraints\n\n1 ≤ N ≤ 100\n−100 ≤ Temperature ≤ 200", "input": "5\n25 80 90 15 50", "output": "Safe Safe Unsafe Unsafe Safe", "solution": "import java.util.*;\nimport java.util.function.Predicate;\n\npublic class Main {\n    interface TemperatureRule {\n        boolean test(int temperature);\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        TemperatureRule safe = t -> t >= 20 && t <= 80;\n\n        for (int i = 0; i < n; i++) {\n            if (i > 0) System.out.print(\" \");\n            System.out.print(safe.test(sc.nextInt()) ? \"Safe\" : \"Unsafe\");\n        }\n        System.out.println();\n    }\n}", "sourceHasSql": false}, {"id": 35, "topic": "Functional Java", "description": "An employee management system searches for an employee name using an employee ID. If\nthe employee exists, the system should display the employee name. If the ID is not found, it\nshould display Employee Not Found.\nWrite a Java program using Optional to safely handle the possibility of a missing employee\nwithout directly checking for a null value.\n\nInput Format\n\nThe first line contains the number of employees.\n\nThe next N lines contain employee ID and employee name.\n\nThe last line contains the ID to search.\n\nOutput Format\n\nPrint the employee name if the ID exists. Otherwise, print Employee Not Found.\n\nCode Constraints\n\n1 ≤ N ≤ 100\n1 ≤ Employee ID ≤ 100000", "input": "3\n101 Amit\n102 Neha\n103 Rahul\n102", "output": "Neha", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        Map<Integer, String> employees = new HashMap<>();\n        for (int i = 0; i < n; i++)\n            employees.put(sc.nextInt(), sc.next());\n\n        int target = sc.nextInt();\n\n        Optional<String> name = Optional.ofNullable(employees.get(target));\n        System.out.println(name.orElse(\"Employee Not Found\"));\n    }\n}", "sourceHasSql": false}, {"id": 36, "topic": "Date-Time API", "description": "A university examination system stores the examination date and needs to determine the\nnumber of days remaining until another specified date.\n\nWrite a Java program using the Java Date-Time API to calculate the number of days between\ntwo given dates.\n\nInput Format\n\nThe first line contains the starting date in the format YYYY-MM-DD.\n\nThe second line contains the ending date in the format YYYY-MM-DD.\n\nOutput Format\n\nPrint the number of days between the two dates.\n\nCode Constraints\nBoth dates are valid dates.\nThe ending date is not earlier than the starting date.", "input": "2026-09-01\n2026-09-15", "output": "14", "solution": "import java.time.*;\nimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        LocalDate start = LocalDate.parse(sc.nextLine());\n        LocalDate end = LocalDate.parse(sc.nextLine());\n\n        System.out.println(end.toEpochDay() - start.toEpochDay());\n    }\n}", "sourceHasSql": false}, {"id": 37, "topic": "JVM & Memory", "description": "A Java application creates several local integer variables inside a method. The program must\ndemonstrate the difference between local variables and dynamically created objects.\n\nWrite a Java program containing a method that creates local primitive variables and an\ninteger array using the new keyword. Print the values of the variables and array elements.\n\nThe objective is to demonstrate that local variables are associated with method execution\nwhile dynamically created objects are stored in heap memory.\n\nInput Format\n\nThe first line contains three integers.\n\nThe second line contains three integers for the array.\n\nOutput Format\n\nPrint the three local values on the first line and the three array values on the second line.\n\nCode Constraints\n\n−10000 ≤ Value ≤ 10000", "input": "10 20 30\n40 50 60", "output": "10 20 30\n40 50 60", "solution": "import java.util.*;\n\npublic class Main {\n    static void display(int a, int b, int c, int[] arr) {\n        // a, b, c are method-local primitive variables.\n        // arr refers to an integer array object allocated with new.\n        System.out.println(a + \" \" + b + \" \" + c);\n        System.out.println(arr[0] + \" \" + arr[1] + \" \" + arr[2]);\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int a = sc.nextInt();\n        int b = sc.nextInt();\n        int c = sc.nextInt();\n\n        int[] arr = new int[3];\n        for (int i = 0; i < 3; i++) arr[i] = sc.nextInt();\n\n        display(a, b, c, arr);\n    }\n}", "sourceHasSql": false}, {"id": 38, "topic": "JVM & Memory", "description": "A student-result application uses a method to calculate the total marks of a student. The\nmethod receives three marks and creates an integer array containing the marks.\nWrite a Java program that uses a separate method to calculate and print the total marks. The\nprogram should demonstrate method-local variables and an array object created during\nexecution.\n\nInput Format\n\nThe first line contains three subject marks.\n\nOutput Format\n\nPrint the total marks.\n\nCode Constraints\n\n0 ≤ Marks ≤ 100", "input": "75 82 90", "output": "247", "solution": "import java.util.*;\n\npublic class Main {\n    static int calculateTotal(int a, int b, int c) {\n        int[] marks = {a, b, c};\n        return marks[0] + marks[1] + marks[2];\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int a = sc.nextInt();\n        int b = sc.nextInt();\n        int c = sc.nextInt();\n\n        System.out.println(calculateTotal(a, b, c));\n    }\n}", "sourceHasSql": false}, {"id": 39, "topic": "JVM & Memory", "description": "A document-processing application creates temporary String objects while processing\ndocuments. After the objects are no longer required, the application requests the JVM to\nperform garbage collection.\n\nWrite a Java program that creates a specified number of temporary objects, removes their\nreferences, requests garbage collection using the appropriate JVM method, and finally prints\nGarbage Collection Requested.\n\nInput Format\n\nThe first line contains the number of temporary objects.\n\nOutput Format\n\nPrint:\n\nGarbage Collection Requested\n\nCode Constraints\n\n1 ≤ N ≤ 10000", "input": "100", "output": "Garbage Collection Requested", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\n        String[] objects = new String[n];\n        for (int i = 0; i < n; i++)\n            objects[i] = new String(\"Temporary Object \" + i);\n\n        objects = null;\n        System.gc();\n\n        System.out.println(\"Garbage Collection Requested\");\n    }\n}", "sourceHasSql": false}, {"id": 40, "topic": "I/O & Performance", "description": "A payroll application calculates the salary of an employee using a simple arithmetic\nexpression. Java source code is compiled into bytecode, which is executed by the JVM.\n\nWrite a Java program that reads the basic salary, allowance, and deduction and calculates\nthe final salary.\n\nFinal Salary = Basic Salary + Allowance − Deduction\n\nInput Format\n\nThe first line contains the basic salary.\n\nThe second line contains the allowance.\n\nThe third line contains the deduction.\n\nOutput Format\n\nPrint the final salary.\n\nCode Constraints\n\n0 ≤ Basic Salary ≤ 1000000\n0 ≤ Allowance ≤ 500000\n0 ≤ Deduction ≤ 500000", "input": "30000\n5000\n2000", "output": "33000", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n\n        long basic = sc.nextLong();\n        long allowance = sc.nextLong();\n        long deduction = sc.nextLong();\n\n        System.out.println(basic + allowance - deduction);\n    }\n}", "sourceHasSql": false}, {"id": 41, "topic": "I/O & Performance", "description": "A data-analysis application receives a large number of integers. To reduce unnecessary\noutput operations, the application must first calculate all results and then print them\ntogether.\n\nWrite a Java program that reads N integers, calculates the square of every integer, stores the\nresults in a StringBuilder, and prints all results at once.\n\nInput Format\n\nThe first line contains N.\nThe second line contains N integers.\n\nOutput Format\n\nPrint the squares separated by spaces.\n\nCode Constraints\n\n1 ≤ N ≤ 100000\n−1000 ≤ Value ≤ 1000", "input": "5\n23456", "output": "4 9 16 25 36", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        StringBuilder out = new StringBuilder();\n\n        for (int i = 0; i < n; i++) {\n            int x = sc.nextInt();\n            if (i > 0) out.append(' ');\n            out.append((long) x * x);\n        }\n\n        System.out.println(out);\n    }\n}", "sourceHasSql": false}, {"id": 42, "topic": "I/O & Performance", "description": "A competitive-programming system receives a large number of integer values. The program\nmust efficiently read all values and calculate their sum.\n\nWrite a Java program using buffered input to efficiently read N integers and calculate their\nsum.\n\nInput Format\n\nThe first line contains N.\n\nThe second line contains N integers separated by spaces.\n\nOutput Format\n\nPrint the sum of all integers.\n\nCode Constraints\n\n1 ≤ N ≤ 100000\n0 ≤ Value ≤ 100000", "input": "5\n10 20 30 40 50", "output": "150", "solution": "import java.io.*;\nimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n\n        int n = Integer.parseInt(br.readLine().trim());\n        StringTokenizer st = new StringTokenizer(br.readLine());\n\n        long sum = 0;\n        for (int i = 0; i < n; i++) {\n            if (!st.hasMoreTokens()) st = new StringTokenizer(br.readLine());\n            sum += Long.parseLong(st.nextToken());\n        }\n\n        System.out.println(sum);\n    }\n}", "sourceHasSql": false}, {"id": 43, "topic": "I/O & Performance", "description": "A weather-monitoring system receives temperature readings continuously. Instead of\nprinting each processed reading immediately, the system should construct the complete\nreport using buffering.\n\nFor each temperature, calculate:\n\nProcessed Temperature = Temperature + 2\n\nUse BufferedReader for input and StringBuilder for constructing the output.\n\nInput Format\n\nThe first line contains N.\n\nThe second line contains N temperature readings.\n\nOutput Format\n\nPrint the processed temperatures separated by spaces.\n\nCode Constraints\n\n1 ≤ N ≤ 100000\n−100 ≤ Temperature ≤ 100", "input": "4\n20 25 30 35", "output": "22 27 32 37", "solution": "import java.io.*;\nimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n\n        int n = Integer.parseInt(br.readLine().trim());\n        StringTokenizer st = new StringTokenizer(br.readLine());\n        StringBuilder out = new StringBuilder();\n\n        for (int i = 0; i < n; i++) {\n            if (!st.hasMoreTokens()) st = new StringTokenizer(br.readLine());\n            int temperature = Integer.parseInt(st.nextToken());\n\n            if (i > 0) out.append(' ');\n            out.append(temperature + 2);\n        }\n\n        System.out.println(out);\n    }\n}", "sourceHasSql": false}, {"id": 44, "topic": "Core Java", "description": "A billing application calculates the total cost of purchased items. Due to an error in the\nexisting logic, the total is incorrectly calculated.\n\nThe correct formula is:\n\nTotal = Quantity × Price\n\nWrite a Java program with the corrected logic to calculate the total cost of each item and\nprint the final total.\n\nInput Format\n\nThe first line contains N.\n\nEach of the next N lines contains quantity and price.\n\nOutput Format\nPrint the total cost of all items.\n\nCode Constraints\n\n1 ≤ N ≤ 100\n1 ≤ Quantity ≤ 1000\n1 ≤ Price ≤ 100000", "input": "3\n2 100\n5 50\n3 200", "output": "1350", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n        long total = 0;\n\n        for (int i = 0; i < n; i++) {\n            long quantity = sc.nextLong();\n            long price = sc.nextLong();\n            total += quantity * price;\n        }\n\n        System.out.println(total);\n    }\n}", "sourceHasSql": false}, {"id": 45, "topic": "Core Java", "description": "A parking-management system calculates the parking fee based on the number of hours a\nvehicle stays in the parking area.\n\nThe fee rules are:\n\n0 hours → 0\n1 to 2 hours → 20 per hour\nMore than 2 hours → 40 per hour\n\nWrite a Java program that correctly handles normal cases as well as the edge cases of zero\nhours and exactly two hours.\n\nInput Format\n\nThe first line contains the number of parking hours.\n\nOutput Format\n\nPrint the parking fee.\n\nCode Constraints\n\n0 ≤ Hours ≤ 100", "input": "2", "output": "40", "solution": "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int hours = sc.nextInt();\n\n        int fee;\n        if (hours == 0) fee = 0;\n        else if (hours <= 2) fee = hours * 20;\n        else fee = hours * 40;\n\n        System.out.println(fee);\n    }\n}", "sourceHasSql": false}, {"id": 46, "topic": "Functional Java", "description": "A financial application needs to apply different operations to an amount. The supported\noperations are addition of a fixed value and multiplication by a fixed value.\n\nWrite a Java program that passes a functional interface as an argument to a method. The\nmethod should apply the received operation to the given amount.\n\nInput Format\n\nThe first line contains the amount.\n\nThe second line contains the operation value.\n\nThe third line contains the operation type: ADD or MULTIPLY.\n\nOutput Format\n\nPrint the resulting amount.\n\nCode Constraints\n\n0 ≤ Amount ≤ 100000\n0 ≤ Value ≤ 1000", "input": "1000\n50\nADD", "output": "1050
